name: TMA gait incremental exact validation

on:
  push:
    branches:
      - tma-gait-incremental-exact-20260924
    paths:
      - 'research/tma_gait_incremental_exact.py'
      - '.github/workflows/tma-gait-incremental-exact.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install analysis dependencies
        run: python -m pip install --upgrade pip && pip install 'numpy>=2,<3' 'pandas>=2,<3' 'scipy>=1.14,<2' 'requests>=2.32,<3' 'scikit-learn>=1.5,<2'
      - name: Run exact-engine incremental information validation
        run: PYTHONPATH=.:research python research/tma_gait_incremental_exact.py
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: tma-gait-incremental-exact-results
          path: research/tma_gait_incremental_exact_results/
          if-no-files-found: error
      - name: Commit results
        run: |
          git config user.name 'TMA analysis bot'
          git config user.email 'actions@users.noreply.github.com'
          git add research/tma_gait_incremental_exact_results
          if ! git diff --cached --quiet; then
            git commit -m 'Add exact-engine incremental gait validation results'
            git push origin HEAD:tma-gait-incremental-exact-20260924
          fi
