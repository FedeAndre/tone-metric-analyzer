name: Buxtehude independent MIDI oracle

on:
  workflow_dispatch:
  push:
    branches:
      - tma-optical-reader-clean-20260919

permissions:
  contents: read

jobs:
  bux-midi-oracle:
    if: "!contains(github.event.head_commit.message, '[skip buxoracle]')"
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Download independent BuxWV 183 MIDI
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/153 Safari/537.36'
          URL='https://kunstderfuge.com/-/mid.files/buxtehude/chorale-preludes_buxwv-183_(mccloskey).mid'
          curl -A "$UA" -L --fail --retry 3 --retry-delay 2 -sS "$URL" -o buxwv183-oracle.mid
          file buxwv183-oracle.mid
          wc -c buxwv183-oracle.mid
          python - <<'PY'
          from pathlib import Path
          p=Path('buxwv183-oracle.mid')
          assert p.read_bytes()[:4] == b'MThd', 'Downloaded file is not MIDI'
          print('BUX_ORACLE_MIDI_OK=1')
          PY
      - name: Inspect independent MIDI timing
        run: |
          pip install mido
          python - <<'PY'
          import json
          from fractions import Fraction
          import mido
          mid=mido.MidiFile('buxwv183-oracle.mid')
          print('BUX_ORACLE_TPB='+str(mid.ticks_per_beat))
          print('BUX_ORACLE_TRACKS='+str(len(mid.tracks)))
          sigs=[]
          attacks=set()
          per_track=[]
          for ti,track in enumerate(mid.tracks):
              tick=0
              local=set()
              for msg in track:
                  tick += msg.time
                  if msg.type=='time_signature':
                      sigs.append((ti,tick,msg.numerator,msg.denominator))
                  if msg.type=='note_on' and getattr(msg,'velocity',0)>0:
                      q=Fraction(tick,mid.ticks_per_beat)
                      local.add(q); attacks.add(q)
              per_track.append((ti,len(local),str(max(local) if local else 0)))
          print('BUX_ORACLE_TIME_SIGNATURES='+json.dumps(sigs))
          print('BUX_ORACLE_ATTACKS='+str(len(attacks)))
          print('BUX_ORACLE_FIRST='+','.join(str(x) for x in sorted(attacks)[:80]))
          print('BUX_ORACLE_LAST='+','.join(str(x) for x in sorted(attacks)[-40:]))
          print('BUX_ORACLE_TRACK_SUMMARY='+json.dumps(per_track))
          PY
      - name: Upload oracle
        uses: actions/upload-artifact@v4
        with:
          name: buxwv183-independent-midi-oracle
          path: buxwv183-oracle.mid
          retention-days: 3
