name: Export TMA worked raw examples
on:
  push:
    branches: [tma-cross-domain-frozen-20260924]
    paths:
      - 'research/export_tma_worked_examples.py'
      - '.github/workflows/export-tma-worked-examples.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          python -m pip install --upgrade pip
          pip install 'numpy>=2,<3' 'pandas>=2,<3' 'scipy>=1.14,<2' 'requests>=2.32,<3' 'scikit-learn>=1.6,<2' 'wfdb>=4.2,<5' 'h5py>=3.12,<4'
      - run: PYTHONPATH=.:research python research/export_tma_worked_examples.py
      - uses: actions/upload-artifact@v4
        with:
          name: tma-worked-examples
          path: research/tma_worked_examples/
      - run: |
          git config user.name 'TMA analysis bot'
          git config user.email 'actions@users.noreply.github.com'
          git add research/tma_worked_examples/
          git commit -m 'Add raw TMA worked examples' || exit 0
          git pull --rebase origin tma-cross-domain-frozen-20260924
          git push origin HEAD:tma-cross-domain-frozen-20260924
