name: Online-causal TMA hierarchy measurement benchmark
on:
  push:
    branches: [research-tma-online-measurement-20261008]
    paths:
      - research/tma_online_causality.py
      - .github/workflows/tma-online-causality.yml
  workflow_dispatch:
permissions: {contents: write}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install 'numpy>=2,<3' 'pandas>=2,<3' 'scipy>=1.14,<2' 'scikit-learn>=1.5,<2' 'requests>=2.32,<3' 'mido>=1.3,<2'
      - name: Exact causal prefix and computational cost audit
        run: PYTHONPATH=.:research python research/tma_online_causality.py
      - uses: actions/upload-artifact@v4
        with:
          name: frozen-TMA-online-causality-audit
          path: research/tma_online_measurement_results/causality_and_cost.json
          if-no-files-found: error
      - name: Preserve verified numeric results
        run: |
          git config user.name 'TMA research bot'
          git config user.email 'actions@users.noreply.github.com'
          git add research/tma_online_measurement_results/causality_and_cost.json
          if ! git diff --cached --quiet; then
            git commit -m 'Audit exact TMA streaming causality and cost'
            git push origin HEAD:research-tma-online-measurement-20261008
          fi
