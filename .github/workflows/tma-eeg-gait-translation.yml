name: TMA EEG-gait translational transform

on:
  push:
    branches: [tma-eeg-gait-translation-20260926]
    paths:
      - 'research/tma_eeg_gait_translation.py'
      - '.github/workflows/tma-eeg-gait-translation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'numpy>=2,<3' 'pandas>=2,<3' 'scipy>=1.14,<2' 'requests>=2.32,<3'
      - name: Run same-subject EEG-gait translational TMA
        run: PYTHONPATH=.:research python research/tma_eeg_gait_translation.py
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: tma-eeg-gait-translation-results
          path: research/tma_eeg_gait_translation_results/
          if-no-files-found: error
      - name: Commit results
        run: |
          git config user.name 'TMA analysis bot'
          git config user.email 'actions@users.noreply.github.com'
          git add research/tma_eeg_gait_translation_results/
          if ! git diff --cached --quiet; then
            git commit -m 'Add EEG-gait translational TMA results'
            git pull --rebase origin tma-eeg-gait-translation-20260926
            git push origin HEAD:tma-eeg-gait-translation-20260926
          fi
