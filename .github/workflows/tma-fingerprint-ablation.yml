name: Verify TMA individual spectrum context ablations
on:
  push:
    branches: [research-tma-individual-ablation-20261008]
    paths:
      - research/tma_fingerprint_ablation.py
      - .github/workflows/tma-fingerprint-ablation.yml
  workflow_dispatch:
permissions: {contents: write}
jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --upgrade pip && pip install 'numpy>=2,<3' 'pandas>=2,<3' 'scipy>=1.14,<2' 'scikit-learn>=1.5,<2'
      - name: Evaluate spectrum composition and independent trial reproducibility
        run: python research/tma_fingerprint_ablation.py
      - uses: actions/upload-artifact@v4
        with:
          name: tma-fingerprint-ablation-verified
          path: research/tma_individual_fingerprint_results/ablation_results.json
          if-no-files-found: error
      - name: Commit results
        run: |
          git config user.name 'TMA research bot'
          git config user.email 'actions@users.noreply.github.com'
          git add research/tma_individual_fingerprint_results/ablation_results.json
          if ! git diff --cached --quiet; then
            git commit -m 'Verify raw, randomized-expected and narrative Fourier fingerprints'
            git push origin HEAD:research-tma-individual-ablation-20261008
          fi
