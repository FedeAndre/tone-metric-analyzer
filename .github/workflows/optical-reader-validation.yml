name: Clean optical reader validation

on:
  push:
    branches:
      - tma-optical-reader-clean-20260919

permissions:
  contents: write

jobs:
  validate:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Independence gate before any analysis
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pytest -q tests/test_independence.py
          echo "SOURCE TREE:"
          find . -maxdepth 2 -type f ! -path './.git/*' | sort

      - name: Install clean optical reader
        run: |
          pip install -r requirements.txt
          pip install --no-deps 'git+https://github.com/BreezeWhite/oemer@dbe2a933d630d0f74805d717960eb259473f5978'

      - name: Cache low-level optical segmentation
        uses: actions/cache@v4
        with:
          path: optical_cache
          key: buxtehude-oemer-dbe2a933d630d0f74805d717960eb259473f5978-300dpi-v1

      - name: Validate standalone API import
        run: |
          python - <<'PY'
          from app import status
          s = status()
          assert s["ok"] is True
          assert s["reader"] == "independent-optical"
          assert s["semantic_timing_used"] is False
          print("API_IMPORT_OK")
          PY

      - name: Validate Railway Docker image and health endpoint
        run: |
          docker build -t tma-optical-reader-clean .
          cid=$(docker run -d -p 8080:8080 tma-optical-reader-clean)
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/status > status.json; then
              break
            fi
            sleep 1
          done
          cat status.json
          python - <<'PY'
          import json
          s=json.load(open("status.json"))
          assert s["ok"] is True
          assert s["version"] == "tma-optical-reader-clean-v1"
          assert s["rhythmic_attacks_ready"] is False
          print("DOCKER_HEALTH_OK")
          PY

      - name: Reconstruct exact Buxtehude regression pages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          curl -L --fail --retry 3             'https://urresearch.rochester.edu/fileDownloadForInstitutionalItem.action?itemFileId=36184&itemId=15575'             -o full.pdf
          pdfseparate -f 105 -l 106 full.pdf page-%d.pdf
          pdfunite page-105.pdf page-106.pdf buxtehude.pdf
          test "$(pdfinfo buxtehude.pdf | awk '/^Pages:/ {print $2}')" -eq 2

      - name: Validate asynchronous full PDF API under 512 MB container limit
        run: |
          cid=$(docker run -d --memory=512m --memory-swap=512m -p 8081:8080 tma-optical-reader-clean)
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8081/api/status > status.json; then
              break
            fi
            sleep 1
          done

          python - <<'PY'
          import json
          s=json.load(open("status.json"))
          assert s["job_mode"]=="asynchronous", s
          PY

          curl --fail --show-error --max-time 30 \
            -F "file=@buxtehude.pdf;type=application/pdf" \
            http://127.0.0.1:8081/api/optical/read \
            -o submitted.json

          job_id=$(python - <<'PY'
          import json
          d=json.load(open("submitted.json"))
          assert d["status"]=="queued", d
          print(d["job_id"])
          PY
          )

          echo "JOB_ID=$job_id"
          completed=0
          for i in $(seq 1 360); do
            curl --fail --show-error --max-time 20 \
              "http://127.0.0.1:8081/api/optical/jobs/$job_id" \
              -o job.json
            state=$(python - <<'PY'
          import json
          d=json.load(open("job.json"))
          print(d["status"])
          PY
            )
            echo "poll=$i status=$state"
            if [ "$state" = "completed" ]; then
              completed=1
              break
            fi
            if [ "$state" = "failed" ]; then
              cat job.json
              exit 1
            fi
            sleep 2
          done

          if [ "$completed" -ne 1 ]; then
            echo "Timed out waiting for asynchronous analysis"
            docker logs --tail 300 "$cid" || true
            exit 1
          fi

          python - <<'PY'
          import json
          d=json.load(open("job.json"))
          r=d["result"]
          assert r["engine"]=="tma-optical-reader-clean-v1"
          assert r["semantic_timing_used"] is False
          assert r["totals"]["measures"]==49, r["totals"]
          assert r["totals"]["noteheads"]>=400, r["totals"]
          print("ASYNC_LOW_MEMORY_FULL_API_OK")
          print(json.dumps(r["totals"], indent=2))
          PY

          docker inspect --format 'status={{.State.Status}} oom={{.State.OOMKilled}} exit={{.State.ExitCode}}' "$cid"

      - name: Run independent image-to-notation graph
        run: |
          python optical_reader.py buxtehude.pdf --out optical_audit --dpi 300 --cache-dir optical_cache
          python - <<'PY'
          import json
          d=json.load(open('optical_audit/notation_graph.json'))
          assert d['engine']=='tma-optical-reader-clean-v1'
          assert d['semantic_timing_used'] is False
          assert len(d['pages'])==2
          # Structural smoke checks only. These do not encode measure-specific answers.
          assert all(p['staff_count'] >= 12 for p in d['pages']), [p['staff_count'] for p in d['pages']]
          assert d['totals']['noteheads'] >= 400, d['totals']
          assert d['totals']['stems'] >= 200, d['totals']
          print('OPTICAL_GRAPH_STRUCTURE_OK')
          print(json.dumps(d['totals'], indent=2))
          PY

      - name: Upload optical audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tma-optical-reader-buxtehude-audit
          path: |
            optical_audit/notation_graph.json
            optical_audit/page_01_optical_overlay.png
            optical_audit/page_02_optical_overlay.png
            optical_cache/page_01.npz
            optical_cache/page_02.npz
          retention-days: 14
