name: Inspect remaining PD datasets
on:
  push:
    branches: [tma-pd-remaining-datasets-20260925]
    paths: ['research/inspect_remaining_pd.py','.github/workflows/inspect-remaining-pd.yml']
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests
      - run: python research/inspect_remaining_pd.py
