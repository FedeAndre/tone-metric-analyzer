name: TMA variable drumming temporal narrative analysis
on:
  push:
    branches: [research-tma-variable-drums-20261008]
    paths: ['research/tma_variable_drums.py','.github/workflows/tma-variable-drums.yml']
  workflow_dispatch:
permissions: {contents: write}
jobs:
  tma:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install
        run: python -m pip install --upgrade pip && pip install 'numpy>=2,<3' 'pandas>=2,<3' 'scipy>=1.14,<2' 'requests>=2.32,<3' 'mido>=1.3,<2' 'scikit-learn>=1.5,<2'
      - name: Full beat-preserving variable-rhythm TMA comparison
        run: PYTHONPATH=.:research python research/tma_variable_drums.py
      - uses: actions/upload-artifact@v4
        with:
          name: tma-variable-groove-results
          path: research/tma_variable_drums_results/
          if-no-files-found: error
      - name: Commit reproducible results
        run: |
          git config user.name 'TMA research bot'
          git config user.email 'actions@users.noreply.github.com'
          git add research/tma_variable_drums_results/
          if ! git diff --cached --quiet; then
            git commit -m 'Archive TMA variable rhythm expressive drumming validation'
            git push origin HEAD:research-tma-variable-drums-20261008
          fi
