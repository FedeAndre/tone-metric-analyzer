name: TMA cross-domain schema diagnostic
on:
  push:
    branches: [tma-cross-domain-frozen-20260924]
    paths:
      - 'research/cross_domain_schema_diagnostic.py'
      - '.github/workflows/tma-cross-domain-schema.yml'
permissions:
  contents: write
jobs:
  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pandas openpyxl requests
      - run: python research/cross_domain_schema_diagnostic.py
      - name: Commit
        run: |
          git config user.name 'TMA analysis bot'
          git config user.email 'actions@users.noreply.github.com'
          git add research/tma_cross_domain_schema/REPORT.txt
          git commit -m 'Add cross-domain schema diagnostic results' || exit 0
          git pull --rebase origin tma-cross-domain-frozen-20260924
          git push origin HEAD:tma-cross-domain-frozen-20260924
