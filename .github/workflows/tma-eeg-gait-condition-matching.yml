name: TMA EEG-gait condition matching audit

on:
  push:
    branches: [tma-eeg-gait-wave-shape-20260927]
    paths:
      - 'research/tma_eeg_gait_condition_matching.py'
      - '.github/workflows/tma-eeg-gait-condition-matching.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'numpy>=2,<3' 'pandas>=2,<3'
      - name: Run condition matching audit
        run: python research/tma_eeg_gait_condition_matching.py
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: tma-eeg-gait-condition-matching-results
          path: research/tma_eeg_gait_wave_shape_results/
          if-no-files-found: error
      - name: Commit results
        run: |
          git config user.name 'TMA analysis bot'
          git config user.email 'actions@users.noreply.github.com'
          git add research/tma_eeg_gait_wave_shape_results/
          if ! git diff --cached --quiet; then
            git commit -m 'Add EEG-gait condition matching audit'
            git pull --rebase origin tma-eeg-gait-wave-shape-20260927
            git push origin HEAD:tma-eeg-gait-wave-shape-20260927
          fi
