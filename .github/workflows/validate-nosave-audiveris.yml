name: Validate Audiveris no-save candidate
on:
  push:
    branches:
      - test-audiveris-nosave-20260914
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Runtime checksum and override audit
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c v0152_sha256.txt
          test ! -e validate_release.py
          test ! -e tone_metric/omr_exact.py
          test ! -e tone_metric/omr_visual_rhythm.py
          test ! -e tone_metric/layer_registration.py
          test ! -e tone_metric/render.py
          test "$(grep -R '^def pdf_to_musicxml' -n tone_metric | wc -l)" -eq 1
          test "$(grep -R -- '"'"'-save'"'"'' -n tone_metric/omr.py 2>/dev/null | wc -l)" -eq 0
          python3 -m py_compile app.py tone_metric/*.py
      - name: Download exact BWV 661 fixture
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-delay 2 -o bwv661-a4.pdf https://www.mutopiaproject.org/ftp/BachJS/BWV661/bwv661/bwv661-a4.pdf
          test "$(stat -c%s bwv661-a4.pdf)" = "101270"
          echo "d50205f28f876126a272ef854e17543d877020e3cd6a106678cdbf5e954502bc  bwv661-a4.pdf" | sha256sum -c -
      - name: Build exact candidate image
        run: docker build -t tone-metric-nosave .
      - name: Build 12-page composite regression PDF
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/work" tone-metric-nosave python3 - <<'PY'
          import fitz
          src=fitz.open('/work/bwv661-a4.pdf')
          out=fitz.open()
          for _ in range(3):
              out.insert_pdf(src)
          out.save('/work/bwv661-12pages.pdf')
          print('pages',out.page_count)
          assert out.page_count==12
          PY
          test -s bwv661-12pages.pdf
      - name: Multi-sheet Audiveris persistence regression without save-every-step
        shell: bash
        run: |
          set -euo pipefail
          rm -rf composite-out && mkdir composite-out
          timeout 900 docker run --rm -v "$PWD:/work" tone-metric-nosave python3 - <<'PY'
          from pathlib import Path
          from tone_metric.omr import pdf_to_musicxml, pdf_to_annotations
          symbolic, omr = pdf_to_musicxml('/work/bwv661-12pages.pdf','/work/composite-out')
          annotation, warning = pdf_to_annotations('/work/bwv661-12pages.pdf','/work/composite-out/annotations')
          print('symbolic',symbolic)
          print('omr',omr)
          print('annotation',annotation)
          print('warning',warning)
          assert Path(symbolic).is_file() and Path(symbolic).stat().st_size > 0
          assert omr is not None and Path(omr).is_file() and Path(omr).stat().st_size > 0
          assert annotation is not None and Path(annotation).is_file() and Path(annotation).stat().st_size > 0
          PY
          python3 - <<'PY'
          import zipfile, pathlib
          omr=next(pathlib.Path('composite-out').rglob('*.omr'))
          with zipfile.ZipFile(omr) as z:
              bad=z.testzip()
              names=z.namelist()
          print('omr',omr,'members',len(names),'bad',bad)
          assert bad is None
          assert 'book.xml' in names
          print('12-page final OMR ZIP integrity: PASS')
          PY
      - name: Exact BWV 661 end-to-end API regression
        shell: bash
        run: |
          set -euo pipefail
          docker rm -f tma-nosave >/dev/null 2>&1 || true
          docker run -d --name tma-nosave -p 18080:8080 tone-metric-nosave
          trap 'docker logs tma-nosave || true; docker rm -f tma-nosave >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18080/api/status >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/api/status
          timeout 290 curl --fail-with-body --silent --show-error \
            -F file=@bwv661-a4.pdf -F meter_override=auto \
            http://127.0.0.1:18080/api/analyze -o bwv.json
          python3 - <<'PY'
          import json
          d=json.load(open('bwv.json'))
          assert d['hit_count']==733, d.get('hit_count')
          assert d.get('symbolic_hit_count')==549, d.get('symbolic_hit_count')
          assert d.get('analysis_hit_source')=='canonical-score-time', d.get('analysis_hit_source')
          events=[e for s in d['segments'] for e in s['events']]
          assert len(events)==733
          assert all(e.get('tone_metric_levels') for e in events)
          assert max(s.get('max_level',0) for s in d['segments'])==9
          po=d.get('physical_overlay') or {}; m=po.get('matching') or {}
          assert po.get('available') is True
          assert m.get('wave_profile_points_mapped')==735, m.get('wave_profile_points_mapped')
          assert m.get('pivot_profile_mapped')==27, m.get('pivot_profile_mapped')
          assert m.get('tree_event_nodes_mapped')==733, m.get('tree_event_nodes_mapped')
          assert m.get('tree_branches_mapped')==732, m.get('tree_branches_mapped')
          print('BWV661 NO-SAVE E2E PASS: 549 -> 733; L1-9; wave 735; pivots 27; tree 733/732')
          PY
          docker logs tma-nosave | tail -120
