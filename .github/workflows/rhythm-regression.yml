name: Clean rhythm regression

on:
  push:
    branches:
      - tma-optical-reader-clean-20260919

permissions:
  contents: read

jobs:
  rhythm:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install reader dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --no-deps 'git+https://github.com/BreezeWhite/oemer@dbe2a933d630d0f74805d717960eb259473f5978'

      - name: Restore Buxtehude optical cache
        uses: actions/cache@v4
        with:
          path: optical_cache
          key: buxtehude-oemer-dbe2a933d630d0f74805d717960eb259473f5978-300dpi-v1

      - name: Build Buxtehude notation graph from cached low-level masks
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          curl -L --fail --retry 3             'https://urresearch.rochester.edu/fileDownloadForInstitutionalItem.action?itemFileId=36184&itemId=15575'             -o full.pdf
          pdfseparate -f 105 -l 106 full.pdf page-%d.pdf
          pdfunite page-105.pdf page-106.pdf buxtehude.pdf
          python optical_reader.py buxtehude.pdf --out bux_audit --dpi 300 --cache-dir optical_cache
          python - <<'PY'
          import json
          from rhythm_reconstructor import reconstruct_attacks
          d=json.load(open('bux_audit/notation_graph.json'))
          r=reconstruct_attacks(d,meter=(4,4))
          print("BUX_RHYTHM_STATS="+json.dumps(r["stats"],sort_keys=True))
          print("BUX_READY="+str(r["rhythmic_attacks_ready"]))
          print("BUX_CONFLICT_MEASURES="+str(sum(bool(m["conflicts"]) for m in r["measures"])))
          print("BUX_UNRESOLVED_MEASURES="+str(len({x["measure_index"] for x in r["unresolved"]})))
          PY

      - name: Reset Buxtehude cache path
        run: rm -rf optical_cache

      - name: Restore exact BWV 661 optical cache
        uses: actions/cache@v4
        with:
          path: bwv661_cache
          key: bwv661-oemer-dbe2a933d630d0f74805d717960eb259473f5978-300dpi-v1

      - name: Build exact BWV 661 notation graph from cached low-level masks
        run: |
          curl -fL --retry 4 --retry-delay 2 -o bwv661.pdf             'https://www.mutopiaproject.org/ftp/BachJS/BWV661/bwv661/bwv661-a4.pdf'
          echo 'd50205f28f876126a272ef854e17543d877020e3cd6a106678cdbf5e954502bc  bwv661.pdf' | sha256sum -c -
          python optical_reader.py bwv661.pdf --out bwv_audit --dpi 300 --cache-dir bwv661_cache
          python - <<'PY'
          import json
          from rhythm_reconstructor import reconstruct_attacks
          d=json.load(open('bwv_audit/notation_graph.json'))
          r=reconstruct_attacks(d,meter=(2,2))
          print("BWV_RHYTHM_STATS="+json.dumps(r["stats"],sort_keys=True))
          print("BWV_READY="+str(r["rhythmic_attacks_ready"]))
          print("BWV_CONFLICT_MEASURES="+str(sum(bool(m["conflicts"]) for m in r["measures"])))
          print("BWV_UNRESOLVED_MEASURES="+str(len({x["measure_index"] for x in r["unresolved"]})))
          PY
