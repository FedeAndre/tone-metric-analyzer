name: TMA Fourier homometric control
on:
  push:
    branches: [research-tma-fourier-20261008]
    paths: ['research/tma_fourier_homometric.py','.github/workflows/tma-fourier-homometric.yml']
  workflow_dispatch:
permissions: {contents: write}
jobs:
  exact:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --upgrade pip && pip install 'numpy>=2,<3' 'pandas>=2,<3' 'scipy>=1.14,<2' 'requests>=2.32,<3' 'mido>=1.3,<2' 'scikit-learn>=1.5,<2'
      - run: PYTHONPATH=.:research python research/tma_fourier_homometric.py
      - uses: actions/upload-artifact@v4
        with:
          name: tma-homometric-onset-spectrum-control
          path: research/tma_fourier_results/homometric_test.json
          if-no-files-found: error
      - name: Commit outputs
        run: |
          git config user.name 'TMA research bot'
          git config user.email 'actions@users.noreply.github.com'
          git add research/tma_fourier_results/homometric_test.json
          if ! git diff --cached --quiet; then
            git commit -m 'Verify homometric onset PSD vs TMA spectra'
            git push origin HEAD:research-tma-fourier-20261008
          fi
