name: Real Gait Fixed-Origin TMA Narratives
on:
  push:
    branches: [research-tma-narrative-20261008]
    paths: ['research/tma_narrative_real_gait.py', '.github/workflows/tma-narrative-real-gait.yml']
  workflow_dispatch:
permissions: {contents: write}
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install 'numpy>=2,<3' 'pandas>=2,<3' 'scipy>=1.14,<2' 'requests>=2.32,<3'
      - name: Analyze complete TMA narrative and matched cycle-order nulls
        run: PYTHONPATH=.:research python research/tma_narrative_real_gait.py
      - uses: actions/upload-artifact@v4
        with:
          name: real-gait-origin-tma-narratives
          path: research/tma_narrative_results/
          if-no-files-found: error
      - name: Commit verified outputs
        run: |
          git config user.name 'TMA research bot'
          git config user.email 'actions@users.noreply.github.com'
          git add research/tma_narrative_results/
          if ! git diff --cached --quiet; then
            git commit -m 'Archive real-gait fractal narrative order controls'
            git push origin HEAD:research-tma-narrative-20261008
          fi
