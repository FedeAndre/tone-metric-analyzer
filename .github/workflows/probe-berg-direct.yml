name: Exact Berg end-to-end regression
on:
  push:
    branches:
      - probe-berg-direct-20260914
permissions:
  contents: read
jobs:
  berg:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Download byte-identical IMSLP02556 fixture
        shell: bash
        run: |
          set -euo pipefail
          url='https://s9.imslp.org/files/imglnks/usimg/d/d4/IMSLP02556-Berg_-_Piano_Sonata_Op.1.pdf'
          curl -A 'Mozilla/5.0' -fL --retry 4 --retry-delay 2 -o berg.pdf "$url"
          test "$(stat -c%s berg.pdf)" = "579006"
          echo '815d95242d6e2076866594174617361c87373bce7e1642b66812240a3aef400c  berg.pdf' | sha256sum -c -
          file berg.pdf
      - name: Runtime checksum and override audit
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c v0152_sha256.txt
          test ! -e validate_release.py
          test ! -e tone_metric/omr_exact.py
          test ! -e tone_metric/omr_visual_rhythm.py
          test ! -e tone_metric/layer_registration.py
          test ! -e tone_metric/render.py
          test "$(grep -R '^def pdf_to_musicxml' -n tone_metric | wc -l)" -eq 1
          if grep -q -- '"-save"' tone_metric/omr.py; then echo 'Unexpected -save remains'; exit 1; fi
          python3 -m py_compile app.py tone_metric/*.py
      - name: Build candidate
        run: docker build -t tone-metric-berg .
      - name: Analyze exact Berg PDF through API
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name tma-berg -p 18080:8080 tone-metric-berg
          trap 'docker logs tma-berg || true; docker rm -f tma-berg >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:18080/api/status >/dev/null && break
            sleep 1
          done
          timeout 900 curl --fail-with-body --silent --show-error \
            -F file=@berg.pdf -F meter_override=auto \
            http://127.0.0.1:18080/api/analyze -o berg.json
          python3 - <<'PY'
          import json
          from collections import Counter

          def is_prime(n):
              if not isinstance(n, int) or n < 2: return False
              if n % 2 == 0: return n == 2
              d=3
              while d*d <= n:
                  if n % d == 0: return False
                  d += 2
              return True

          d=json.load(open('berg.json'))
          events=[e for s in d.get('segments',[]) for e in s.get('events',[])]
          without=[e for e in events if not e.get('tone_metric_levels')]
          pair_counts=Counter()
          ordinary=[]
          prime_tuplet_unmapped=[]
          composite_tuplet_unmapped=[]
          for e in without:
              pairs=[]
              for src in e.get('source_notes',[]):
                  a=src.get('tuplet_actual'); n=src.get('tuplet_normal')
                  if isinstance(a,int) and isinstance(n,int) and a != n:
                      pairs.append((a,n))
                      pair_counts[(a,n)] += 1
              if not pairs:
                  ordinary.append(e)
              elif any(is_prime(a) for a,_ in pairs):
                  prime_tuplet_unmapped.append(e)
              else:
                  composite_tuplet_unmapped.append(e)
          po=d.get('physical_overlay') or {}
          m=po.get('matching') or {}
          summary={
            'analysis_hit_source': d.get('analysis_hit_source'),
            'symbolic_hit_count': d.get('symbolic_hit_count'),
            'canonical_hit_count': d.get('canonical_hit_count'),
            'hit_count': d.get('hit_count'),
            'levels_enabled': d.get('levels_enabled'),
            'max_level': d.get('max_level'),
            'segment_count': len(d.get('segments',[])),
            'event_count': len(events),
            'events_without_levels': len(without),
            'unmapped_tuplet_pairs': {f'{a}:{n}':c for (a,n),c in sorted(pair_counts.items())},
            'ordinary_unmapped': len(ordinary),
            'prime_tuplet_unmapped': len(prime_tuplet_unmapped),
            'composite_tuplet_unmapped': len(composite_tuplet_unmapped),
            'physical_overlay_available': po.get('available'),
            'physical_matching': m,
            'parse_warnings': d.get('parse_warnings'),
            'segment_warnings': [w for s in d.get('segments',[]) for w in s.get('warnings',[])],
            'physical_warnings': po.get('warnings'),
            'omr_saved': d.get('omr_saved'),
          }
          print(json.dumps(summary, indent=2))
          if without:
              print('UNMAPPED EVENT SAMPLE')
              for e in without[:60]:
                  print(json.dumps({
                    'measure':e.get('measure_number'),
                    'offset':e.get('offset_in_measure_quarter'),
                    'onset':e.get('onset_quarter'),
                    'pitches':e.get('pitches'),
                    'sources':e.get('source_notes'),
                  }, sort_keys=True))
          assert d.get('analysis_hit_source') == 'canonical-score-time'
          assert int(d.get('canonical_hit_count') or 0) > 0
          assert int(d.get('symbolic_hit_count') or 0) > 0
          assert len(events) > 0
          # The accepted dissertation policy retains composite tuplets but does not
          # invent a unique hierarchy for ambiguous composite groupings. Ordinary
          # attacks and explicitly prime tuplets must still map.
          assert len(ordinary) == 0, f'ordinary unmapped attacks: {len(ordinary)}'
          assert len(prime_tuplet_unmapped) == 0, f'prime-tuplet unmapped attacks: {len(prime_tuplet_unmapped)}'
          assert int(d.get('max_level') or 0) >= 1
          assert d.get('omr_saved') is True
          assert po.get('available') is True
          PY
          echo 'EXACT BERG API REGRESSION: PASS'
