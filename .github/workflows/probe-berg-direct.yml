name: Probe exact Berg direct source
on:
  push:
    branches:
      - probe-berg-direct-20260914
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe exact IMSLP02556 bytes
        shell: bash
        run: |
          set -u
          expected_size=579006
          expected_sha=815d95242d6e2076866594174617361c87373bce7e1642b66812240a3aef400c
          urls=(
            'https://imslp.org/files/imglnks/usimg/5/52/IMSLP02556-Berg_-_Piano_Sonata_Op.1.pdf'
            'https://s9.imslp.org/files/imglnks/usimg/5/52/IMSLP02556-Berg_-_Piano_Sonata_Op.1.pdf'
            'https://ks15.imslp.org/files/imglnks/usimg/5/52/IMSLP02556-Berg_-_Piano_Sonata_Op.1.pdf'
            'https://imslp.org/files/imglnks/usimg/d/d4/IMSLP02556-Berg_-_Piano_Sonata_Op.1.pdf'
            'https://s9.imslp.org/files/imglnks/usimg/d/d4/IMSLP02556-Berg_-_Piano_Sonata_Op.1.pdf'
            'https://ks15.imslp.org/files/imglnks/usimg/d/d4/IMSLP02556-Berg_-_Piano_Sonata_Op.1.pdf'
            'https://imslp.org/files/imglnks/usimg/d/d4/Berg_-_Piano_Sonata_Op.1.pdf'
            'https://s9.imslp.org/files/imglnks/usimg/d/d4/Berg_-_Piano_Sonata_Op.1.pdf'
            'https://ks15.imslp.org/files/imglnks/usimg/d/d4/Berg_-_Piano_Sonata_Op.1.pdf'
            'https://imslp.eu/files/imglnks/euimg/5/52/IMSLP02556-Berg_-_Piano_Sonata_Op.1.pdf'
            'https://imslp.eu/files/imglnks/euimg/d/d4/IMSLP02556-Berg_-_Piano_Sonata_Op.1.pdf'
          )
          found=0
          i=0
          for u in "${urls[@]}"; do
            i=$((i+1)); rm -f candidate.pdf
            echo "TRY $i $u"
            if curl -A 'Mozilla/5.0' -fL --connect-timeout 10 --max-time 45 -o candidate.pdf "$u"; then
              size=$(stat -c%s candidate.pdf)
              sha=$(sha256sum candidate.pdf | awk '{print $1}')
              type=$(file -b candidate.pdf || true)
              echo "RESULT size=$size sha=$sha type=$type"
              if [ "$size" = "$expected_size" ] && [ "$sha" = "$expected_sha" ]; then
                echo "EXACT_BERG_SOURCE=$u"
                found=1
                break
              fi
            else
              echo 'curl failed'
            fi
          done
          test "$found" = 1
