name: Validate full OMR framework integration
on:
  push:
    branches:
      - full-omr-framework-fix-20260914
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Python runtime dependencies for validation
        run: python3 -m pip install -r requirements.txt

      - name: Integrate authoritative full-score framework fix
        run: python3 .github/scripts/full_framework_patch.py

      - name: Targeted checks, checksums, and clean override audit
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. PYTHONDONTWRITEBYTECODE=1 python3 .github/scripts/full_framework_validate.py prepare
          sha256sum -c v0152_sha256.txt
          test ! -e validate_release.py
          test ! -e tone_metric/omr_exact.py
          test ! -e tone_metric/omr_visual_rhythm.py
          test ! -e tone_metric/layer_registration.py
          test ! -e tone_metric/render.py

      - name: Build candidate Docker image
        run: docker build -t tma-full-framework .

      - name: Download exact Berg and BWV fixtures
        shell: bash
        run: |
          set -euo pipefail
          curl -A 'Mozilla/5.0' -fL --retry 4 --retry-delay 2 -o berg.pdf 'https://s9.imslp.org/files/imglnks/usimg/d/d4/IMSLP02556-Berg_-_Piano_Sonata_Op.1.pdf'
          test "$(stat -c%s berg.pdf)" = "579006"
          echo '815d95242d6e2076866594174617361c87373bce7e1642b66812240a3aef400c  berg.pdf' | sha256sum -c -
          curl -fL --retry 4 --retry-delay 2 -o bwv661.pdf 'https://www.mutopiaproject.org/ftp/BachJS/BWV661/bwv661/bwv661-a4.pdf'
          test "$(stat -c%s bwv661.pdf)" = "101270"
          echo 'd50205f28f876126a272ef854e17543d877020e3cd6a106678cdbf5e954502bc  bwv661.pdf' | sha256sum -c -

      - name: Exact full-score Berg and unchanged BWV API regressions
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name tma-framework -p 18080:8080 tma-full-framework
          trap 'docker logs tma-framework || true; docker rm -f tma-framework >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 90); do
            curl -fsS http://127.0.0.1:18080/api/status >/dev/null && break
            sleep 1
          done
          timeout 900 curl --fail-with-body --silent --show-error -F file=@berg.pdf -F meter_override=auto http://127.0.0.1:18080/api/analyze -o berg.json
          PYTHONPATH=. PYTHONDONTWRITEBYTECODE=1 python3 .github/scripts/full_framework_validate.py berg berg.json
          timeout 900 curl --fail-with-body --silent --show-error -F file=@bwv661.pdf -F meter_override=auto http://127.0.0.1:18080/api/analyze -o bwv.json
          PYTHONPATH=. PYTHONDONTWRITEBYTECODE=1 python3 .github/scripts/full_framework_validate.py bwv bwv.json

      - name: Final clean-tree audit and commit validated runtime only
        shell: bash
        run: |
          set -euo pipefail
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          sha256sum -c v0152_sha256.txt
          git status --short
          git config user.name 'FedeAndre'
          git config user.email 'federico.andreoni@gmail.com'
          git add app.py tone_metric/canonical_score.py v0152_sha256.txt
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = "app.py tone_metric/canonical_score.py v0152_sha256.txt "
          git commit -m 'Integrate full OMR measure framework and fail-closed PDF recovery [skip ci]'
          git push origin HEAD:full-omr-framework-fix-20260914
