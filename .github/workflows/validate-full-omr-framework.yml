          trap 'docker logs tma-framework || true; docker rm -f tma-framework >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 90); do curl -fsS http://127.0.0.1:18080/api/status >/dev/null && break; sleep 1; done
          timeout 900 curl --fail-with-body --silent --show-error -F file=@berg.pdf -F meter_override=auto http://127.0.0.1:18080/api/analyze -o berg.json
