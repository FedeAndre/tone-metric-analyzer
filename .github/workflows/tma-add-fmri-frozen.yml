name: TMA add raw HCP fMRI to frozen comparator

on:
  push:
    branches: [tma-cross-domain-frozen-20260924]
    paths:
      - 'research/add_fmri_to_frozen.py'
      - 'research/tma_cross_domain_frozen.py'
      - '.github/workflows/tma-add-fmri-frozen.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'numpy>=2,<3' 'pandas>=2,<3' 'scipy>=1.14,<2' 'requests>=2.32,<3'
      - name: Add raw HCP fMRI and recompute frozen comparator
        run: PYTHONPATH=.:research python research/add_fmri_to_frozen.py
      - uses: actions/upload-artifact@v4
        with:
          name: tma-frozen-seven-domain-with-fmri
          path: research/tma_cross_domain_frozen_results/
          if-no-files-found: error
      - name: Commit results
        run: |
          git config user.name 'TMA analysis bot'
          git config user.email 'actions@users.noreply.github.com'
          git add research/tma_cross_domain_frozen_results/
          if ! git diff --cached --quiet; then
            git commit -m 'Add raw HCP fMRI to frozen cross-domain results'
            git pull --rebase origin tma-cross-domain-frozen-20260924
            git push origin HEAD:tma-cross-domain-frozen-20260924
          fi
