name: Verify Fourier interference between Tone Metric Levels
on:
  push:
    branches: [research-tma-level-interference-variation-20261008]
    paths:
      - research/tma_level_interference.py
      - .github/workflows/tma-level-interference.yml
  workflow_dispatch:
permissions: {contents: write}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install 'numpy>=2,<3' 'pandas>=2,<3' 'scipy>=1.14,<2' 'scikit-learn>=1.5,<2' 'requests>=2.32,<3' 'mido>=1.3,<2'
      - run: PYTHONPATH=.:research python research/tma_level_interference.py
      - uses: actions/upload-artifact@v4
        with:
          name: TMA-level-cross-frequency-interference
          path: research/tma_level_interference_results/
          if-no-files-found: error
      - name: Commit validated summary
        run: |
          git config user.name 'TMA research bot'
          git config user.email 'actions@users.noreply.github.com'
          git add research/tma_level_interference_results/results.json
          if ! git diff --cached --quiet; then
            git commit -m 'Verify TMA Level-Fourier coherence and interference'
            git push origin HEAD:research-tma-level-interference-variation-20261008
          fi
