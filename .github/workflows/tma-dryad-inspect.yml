name: Inspect compact independent human rhythm-tapping data
on:
  push:
    branches: [research-tma-eeahr-auditory-20261008]
    paths: ['research/tma_dryad_inspect.py','.github/workflows/tma-dryad-inspect.yml']
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests 'numpy>=2,<3' 'scipy>=1.14,<2'
      - run: python research/tma_dryad_inspect.py
