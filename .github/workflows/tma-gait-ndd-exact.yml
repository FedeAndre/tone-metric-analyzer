name: Exact TMA GaitNDD validation
on:
  push:
    branches: [tma-gait-ndd-exact-20260925]
    paths:
      - 'research/tma_gait_ndd_exact.py'
      - '.github/workflows/tma-gait-ndd-exact.yml'
      - 'tone_metric/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install 'numpy>=2,<3' 'pandas>=2,<3' 'scipy>=1.14,<2' 'requests>=2.32,<3' 'wfdb>=4.2,<5' 'scikit-learn>=1.6,<2'
      - name: Run exact paper-aligned GaitNDD analysis
        run: PYTHONPATH=. python research/tma_gait_ndd_exact.py
      - uses: actions/upload-artifact@v4
        with:
          name: tma-gait-ndd-exact-results
          path: research/tma_gait_ndd_exact_results/
          if-no-files-found: error
      - name: Commit results
        run: |
          git config user.name 'TMA analysis bot'
          git config user.email 'actions@users.noreply.github.com'
          git add research/tma_gait_ndd_exact_results/
          if ! git diff --cached --quiet; then
            git commit -m 'Add exact TMA GaitNDD results'
            git pull --rebase origin tma-gait-ndd-exact-20260925
            git push origin HEAD:tma-gait-ndd-exact-20260925
          fi
