name: Buxtehude rhythm quickcheck

on:
  push:
    branches:
      - tma-optical-reader-clean-20260919

permissions:
  contents: read

jobs:
  bux:
    if: "!contains(github.event.head_commit.message, '[skip buxq]')"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --no-deps 'git+https://github.com/BreezeWhite/oemer@dbe2a933d630d0f74805d717960eb259473f5978'
          pip install mido
      - uses: actions/cache@v4
        with:
          path: optical_cache
          key: buxtehude-oemer-dbe2a933d630d0f74805d717960eb259473f5978-300dpi-v1
      - name: Run cached Buxtehude rhythm reconstruction
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          curl -L --fail --retry 3 \
            'https://urresearch.rochester.edu/fileDownloadForInstitutionalItem.action?itemFileId=36184&itemId=15575' \
            -o full.pdf
          pdfseparate -f 105 -l 106 full.pdf page-%d.pdf
          pdfunite page-105.pdf page-106.pdf buxtehude.pdf
          python optical_reader.py buxtehude.pdf --out bux_audit --dpi 300 --cache-dir optical_cache
          python - <<'PY'
          import json
          from collections import Counter
          from rhythm_reconstructor import reconstruct_attacks
          d=json.load(open('bux_audit/notation_graph.json'))
          r=reconstruct_attacks(d,meter=(4,4))
          json.dump(r,open('bux_audit/rhythm_audit.json','w'),indent=2)
          print("BUX_RHYTHM_STATS="+json.dumps(r["stats"],sort_keys=True))
          print("BUX_READY="+str(r["rhythmic_attacks_ready"]))
          print("BUX_CONFLICT_MEASURES="+str(sum(bool(m["conflicts"]) for m in r["measures"])))
          print("BUX_UNRESOLVED_MEASURES="+str(len({x["measure_index"] for x in r["unresolved"]})))
          print("BUX_UNRESOLVED_REASONS="+json.dumps(Counter(x["reason"] for x in r["unresolved"]),sort_keys=True))
          print("BUX_PROBLEM_MEASURES_BEGIN")
          unresolved_by_measure={}
          for row in r["unresolved"]:
              unresolved_by_measure.setdefault(row["measure_index"],[]).append(row)
          for m in r["measures"]:
              mi=m["measure_index"]
              if m["conflicts"] or mi in unresolved_by_measure:
                  print(json.dumps({
                      "measure_index":mi,
                      "page":m["page"],
                      "system_id":m["system_id"],
                      "measure_in_system":m["measure_in_system"],
                      "voices":m["voice_solutions"],
                      "conflicts":m["conflicts"],
                      "unresolved":unresolved_by_measure.get(mi,[]),
                  },sort_keys=True))
          print("BUX_PROBLEM_MEASURES_END")
          PY

          curl -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/153 Safari/537.36' \
            -L --fail --retry 3 --retry-delay 2 -sS \
            'https://kunstderfuge.com/-/mid.files/buxtehude/chorale-preludes_buxwv-183_(mccloskey).mid' \
            -o buxwv183-oracle.mid

          python - <<'PY'
          import json
          from fractions import Fraction
          import mido

          r=json.load(open('bux_audit/rhythm_audit.json'))
          observed={Fraction(str(h['onset_quarter'])) for h in r['hits']}
          unresolved_by_measure={}
          for row in r['unresolved']:
              unresolved_by_measure.setdefault(int(row['measure_index']),0)
              unresolved_by_measure[int(row['measure_index'])]+=1

          mid=mido.MidiFile('buxwv183-oracle.mid')
          oracle=set()
          for track in mid.tracks:
              tick=0
              for msg in track:
                  tick += msg.time
                  if msg.type=='note_on' and getattr(msg,'velocity',0)>0:
                      oracle.add(Fraction(tick,mid.ticks_per_beat))

          tp=observed & oracle
          fp=observed-oracle
          fn=oracle-observed
          print('BUX_ORACLE_ATTACKS='+str(len(oracle)))
          print('BUX_OBSERVED_ATTACKS='+str(len(observed)))
          print('BUX_ATTACK_TP='+str(len(tp)))
          print('BUX_ATTACK_FP='+str(len(fp)))
          print('BUX_ATTACK_FN='+str(len(fn)))
          print('BUX_ATTACK_PRECISION='+f'{len(tp)/len(observed):.8f}' if observed else 'BUX_ATTACK_PRECISION=0')
          print('BUX_ATTACK_RECALL='+f'{len(tp)/len(oracle):.8f}' if oracle else 'BUX_ATTACK_RECALL=0')
          print('BUX_FIRST_FP='+','.join(str(x) for x in sorted(fp)[:100]))
          print('BUX_FIRST_FN='+','.join(str(x) for x in sorted(fn)[:120]))

          per=[]
          for mi in range(49):
              start=Fraction(mi*4)
              end=start+4
              oo=sorted(x-start for x in observed if start <= x < end)
              rr=sorted(x-start for x in oracle if start <= x < end)
              fpm=sorted(set(oo)-set(rr))
              fnm=sorted(set(rr)-set(oo))
              if fpm or fnm or mi in unresolved_by_measure:
                  per.append({
                      'measure':mi+1,
                      'observed':[str(x) for x in oo],
                      'oracle':[str(x) for x in rr],
                      'fp':[str(x) for x in fpm],
                      'fn':[str(x) for x in fnm],
                      'unresolved':unresolved_by_measure.get(mi,0),
                  })
          print('BUX_ORACLE_MEASURE_DIFFS='+json.dumps(per,separators=(',',':')))
          PY

          python - <<'PY'
          import json
          from statistics import median
          from rhythm_reconstructor import _build_measure_events, _cluster_columns
          d=json.load(open('bux_audit/notation_graph.json'))
          r=json.load(open('bux_audit/rhythm_audit.json'))
          bad={int(x['measure_index']) for x in r['unresolved']}
          gi=0
          rows=[]
          for page in d['pages']:
              systems={int(s['id']):s for s in page.get('systems',[])}
              staves={int(s['id']):s for s in page.get('staves',[])}
              measures=sorted(page.get('measures',[]),key=lambda m:(int(m.get('system_id',0)),int(m.get('measure_in_system',0)),float(m.get('left',0))))
              for measure in measures:
                  if gi in bad:
                      events=_build_measure_events(page,measure)
                      temporal=[e for e in events if e.kind!='measure_rest']
                      sys=systems.get(int(measure.get('system_id',0)),{})
                      ss=[float(staves[i].get('spacing',18) or 18) for i in sys.get('staff_ids',[]) if i in staves]
                      sp=float(median(ss)) if ss else 18.0
                      cols=_cluster_columns(temporal,0.65*sp)
                      left=float(measure['left']); right=float(measure['right'])
                      xs=[float(median([e.x for e in col])) for col in cols]
                      norm=[round((x-left)/(right-left),5) for x in xs]
                      rows.append({'measure':gi+1,'left':round(left,2),'right':round(right,2),'columns':len(cols),'norm_x':norm,'events':[[e.id for e in col] for col in cols]})
                  gi+=1
          print('BUX_COLUMN_GEOMETRY='+json.dumps(rows,separators=(',',':')))
          PY

      - name: Upload Buxtehude rhythm audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buxtehude-rhythm-quickcheck
          path: |
            bux_audit/notation_graph.json
            bux_audit/rhythm_audit.json
            bux_audit/page_*_optical_overlay.png
          retention-days: 7
