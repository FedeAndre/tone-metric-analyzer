name: Buxtehude rhythm quickcheck

on:
  push:
    branches:
      - tma-optical-reader-clean-20260919

permissions:
  contents: read

jobs:
  bux:
    if: "!contains(github.event.head_commit.message, '[skip buxq]')"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --no-deps 'git+https://github.com/BreezeWhite/oemer@dbe2a933d630d0f74805d717960eb259473f5978'
      - uses: actions/cache@v4
        with:
          path: optical_cache
          key: buxtehude-oemer-dbe2a933d630d0f74805d717960eb259473f5978-300dpi-v1
      - name: Run cached Buxtehude rhythm reconstruction
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          curl -L --fail --retry 3 \
            'https://urresearch.rochester.edu/fileDownloadForInstitutionalItem.action?itemFileId=36184&itemId=15575' \
            -o full.pdf
          pdfseparate -f 105 -l 106 full.pdf page-%d.pdf
          pdfunite page-105.pdf page-106.pdf buxtehude.pdf
          python optical_reader.py buxtehude.pdf --out bux_audit --dpi 300 --cache-dir optical_cache
          python - <<'PY'
          import json
          from collections import Counter
          from rhythm_reconstructor import reconstruct_attacks
          d=json.load(open('bux_audit/notation_graph.json'))
          r=reconstruct_attacks(d,meter=(4,4))
          print("BUX_RHYTHM_STATS="+json.dumps(r["stats"],sort_keys=True))
          print("BUX_READY="+str(r["rhythmic_attacks_ready"]))
          print("BUX_CONFLICT_MEASURES="+str(sum(bool(m["conflicts"]) for m in r["measures"])))
          print("BUX_UNRESOLVED_MEASURES="+str(len({x["measure_index"] for x in r["unresolved"]})))
          print("BUX_UNRESOLVED_REASONS="+json.dumps(Counter(x["reason"] for x in r["unresolved"]),sort_keys=True))
          print("BUX_PROBLEM_MEASURES_BEGIN")
          unresolved_by_measure={}
          for row in r["unresolved"]:
              unresolved_by_measure.setdefault(row["measure_index"],[]).append(row)
          for m in r["measures"]:
              mi=m["measure_index"]
              if m["conflicts"] or mi in unresolved_by_measure:
                  print(json.dumps({
                      "measure_index":mi,
                      "page":m["page"],
                      "system_id":m["system_id"],
                      "measure_in_system":m["measure_in_system"],
                      "voices":m["voice_solutions"],
                      "conflicts":m["conflicts"],
                      "unresolved":unresolved_by_measure.get(mi,[]),
                  },sort_keys=True))
          print("BUX_PROBLEM_MEASURES_END")
          PY
