name: TMA temporal robustness audit
on:
  push:
    branches: [research-tma-temporal-sensitivity-20261008]
    paths: ['research/tma_temporal_sensitivity.py', '.github/workflows/tma-temporal-sensitivity.yml']
  workflow_dispatch:
permissions: {contents: write}
jobs:
  robustness:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --upgrade pip && pip install 'numpy>=2,<3' 'pandas>=2,<3' 'scikit-learn>=1.5,<2' 'requests>=2.32,<3'
      - name: Regularization and feature-selection robustness
        run: python research/tma_temporal_sensitivity.py
      - uses: actions/upload-artifact@v4
        with:
          name: tma-temporal-sensitivity
          path: research/tma_temporal_evolution_results/sensitivity.json
          if-no-files-found: error
      - name: Commit outputs
        run: |
          git config user.name 'TMA research bot'
          git config user.email 'actions@users.noreply.github.com'
          git add research/tma_temporal_evolution_results/sensitivity.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record regularization sensitivity of temporal TMA'
            git push origin HEAD:research-tma-temporal-sensitivity-20261008
          fi
