name: Evaluate anosmic nasal peak detection
on:
  push:
    branches: [research-tma-physio-spectral-20261008]
    paths: ['research/anosmia_peak_scout.py','.github/workflows/anosmia-peak-scout.yml']
  workflow_dispatch:
jobs:
  peaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install 'numpy>=2,<3' 'scipy>=1.14,<2' requests
      - run: python research/anosmia_peak_scout.py
