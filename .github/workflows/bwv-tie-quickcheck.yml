name: BWV tie and rhythm quickcheck

on:
  push:
    branches:
      - tma-optical-reader-clean-20260919

permissions:
  contents: read

jobs:
  bwv-tie:
    if: "!contains(github.event.head_commit.message, '[skip tieq]')"
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --no-deps 'git+https://github.com/BreezeWhite/oemer@dbe2a933d630d0f74805d717960eb259473f5978'
      - uses: actions/cache@v4
        with:
          path: bwv661_cache
          key: bwv661-oemer-dbe2a933d630d0f74805d717960eb259473f5978-300dpi-v1
      - name: Install validation-only LilyPond oracle tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lilypond
          pip install mido

      - name: Run cached exact BWV 661 tie and rhythm audit
        run: |
          curl -fL --retry 4 --retry-delay 2 -o bwv661.pdf \
            'https://www.mutopiaproject.org/ftp/BachJS/BWV661/bwv661/bwv661-a4.pdf'
          echo 'd50205f28f876126a272ef854e17543d877020e3cd6a106678cdbf5e954502bc  bwv661.pdf' | sha256sum -c -
          python optical_reader.py bwv661.pdf --out bwv_audit --dpi 300 --cache-dir bwv661_cache
          python - <<'PY'
          import json
          from collections import Counter
          from rhythm_reconstructor import reconstruct_attacks
          d=json.load(open('bwv_audit/notation_graph.json'))
          ties=[]
          for p in d['pages']:
              for t in p.get('tie_candidates',[]):
                  ties.append((p['page'],t))
          print('BWV_TIE_COUNT='+str(len(ties)))
          print('BWV_TIE_CONF='+json.dumps(Counter(round(float(t[1]['confidence']),1) for t in ties),sort_keys=True))
          print('BWV_TIES='+json.dumps(ties[:80],sort_keys=True))
          r=reconstruct_attacks(d,meter=(2,2))
          print('BWV_RHYTHM_STATS='+json.dumps(r['stats'],sort_keys=True))
          print('BWV_READY='+str(r['rhythmic_attacks_ready']))
          print('BWV_UNRESOLVED_REASONS='+json.dumps(Counter(x['reason'] for x in r['unresolved']),sort_keys=True))
          PY

      - name: Compare optical hits with independent Mutopia source oracle
        run: |
          curl -fL --retry 4 --retry-delay 2 -o bwv661.ly \
            'https://raw.githubusercontent.com/MutopiaProject/MutopiaProject/master/ftp/BachJS/BWV661/bwv661/bwv661.ly'
          convert-ly -e bwv661.ly
          lilypond -dno-point-and-click -o bwv_oracle bwv661.ly >/tmp/bwv_lilypond.log 2>&1 || {
            cat /tmp/bwv_lilypond.log
            exit 1
          }
          cat /tmp/bwv_lilypond.log | tail -60
          python - <<'PY'
          import glob, json
          from fractions import Fraction
          import mido
          from rhythm_reconstructor import reconstruct_attacks

          midi_paths=glob.glob('bwv_oracle*.midi')+glob.glob('bwv_oracle*.mid')
          assert midi_paths, 'No MIDI oracle generated'
          mid=mido.MidiFile(midi_paths[0])
          oracle=set()
          for track in mid.tracks:
              tick=0
              for msg in track:
                  tick += msg.time
                  if msg.type=='note_on' and getattr(msg,'velocity',0)>0:
                      oracle.add(Fraction(tick,mid.ticks_per_beat))

          graph=json.load(open('bwv_audit/notation_graph.json'))
          rhythm=reconstruct_attacks(graph,meter=(2,2))
          observed={Fraction(str(h['onset_quarter'])) for h in rhythm['hits']}
          tp=oracle & observed
          fp=observed-oracle
          fn=oracle-observed
          print('BWV_ORACLE_ATTACKS='+str(len(oracle)))
          print('BWV_OBSERVED_ATTACKS='+str(len(observed)))
          print('BWV_ATTACK_TP='+str(len(tp)))
          print('BWV_ATTACK_FP='+str(len(fp)))
          print('BWV_ATTACK_FN='+str(len(fn)))
          print('BWV_ATTACK_PRECISION='+f'{len(tp)/len(observed):.8f}' if observed else 'BWV_ATTACK_PRECISION=0')
          print('BWV_ATTACK_RECALL='+f'{len(tp)/len(oracle):.8f}' if oracle else 'BWV_ATTACK_RECALL=0')
          print('BWV_FIRST_FP='+','.join(str(x) for x in sorted(fp)[:80]))
          print('BWV_FIRST_FN='+','.join(str(x) for x in sorted(fn)[:80]))
          PY
