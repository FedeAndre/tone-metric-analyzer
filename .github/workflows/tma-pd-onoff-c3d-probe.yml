name: TMA PD ON-OFF raw C3D probe

on:
  push:
    branches:
      - tma-clinical-onoff-validation-20260927
    paths:
      - 'research/tma_pd_onoff_c3d_probe.py'
      - '.github/workflows/tma-pd-onoff-c3d-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install --upgrade pip && pip install requests ezc3d numpy
      - name: Probe raw C3D archive
        run: python research/tma_pd_onoff_c3d_probe.py
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: tma-pd-onoff-c3d-probe
          path: |
            research/tma_pd_onoff_results/C3D_PROBE.md
            research/tma_pd_onoff_results/C3D_MEMBERS.txt
          if-no-files-found: error
      - name: Commit probe results
        run: |
          git config user.name 'TMA analysis bot'
          git config user.email 'actions@users.noreply.github.com'
          git add research/tma_pd_onoff_results/C3D_PROBE.md research/tma_pd_onoff_results/C3D_MEMBERS.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Add raw C3D ON/OFF probe results'
            git push origin HEAD:tma-clinical-onoff-validation-20260927
          fi
