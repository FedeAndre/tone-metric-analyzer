name: Exhaustive matched-rhythm TMA spectral falsification
on:
  push:
    branches: [research-tma-controlled-spectra-20261008]
    paths:
      - research/tma_controlled_spectra.py
      - .github/workflows/tma-controlled-spectra.yml
  workflow_dispatch:
permissions: {contents: write}
jobs:
  math:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --upgrade pip && pip install 'numpy>=2,<3' 'pandas>=2,<3' 'scipy>=1.14,<2' 'requests>=2.32,<3' 'mido>=1.3,<2' 'scikit-learn>=1.5,<2'
      - run: PYTHONPATH=.:research python research/tma_controlled_spectra.py
      - uses: actions/upload-artifact@v4
        with:
          name: tma-controlled-matched-rhythms
          path: research/tma_controlled_spectra_results/
          if-no-files-found: error
      - name: Commit results
        run: |
          git config user.name 'TMA research bot'
          git config user.email 'actions@users.noreply.github.com'
          git add research/tma_controlled_spectra_results/results.json
          if ! git diff --cached --quiet; then
            git commit -m 'Archive exact matched-rhythm Fourier comparison'
            git push origin HEAD:research-tma-controlled-spectra-20261008
          fi
