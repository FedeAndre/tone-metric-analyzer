name: TMA Cardiorespiratory Temporal Evolution
on:
  push:
    branches: [research-tma-cardioresp-evolution-20261008]
    paths: ['research/tma_cardioresp_evolution.py', '.github/workflows/tma-cardioresp-evolution.yml']
  workflow_dispatch:
permissions: {contents: write}
jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install
        run: python -m pip install --upgrade pip && pip install 'numpy>=2,<3' 'pandas>=2,<3' 'scipy>=1.14,<2' 'scikit-learn>=1.5,<2' 'wfdb>=4.2,<5' 'requests>=2.32,<3'
      - name: Respiration-anchored ECG temporal test
        run: PYTHONPATH=.:research python research/tma_cardioresp_evolution.py
      - uses: actions/upload-artifact@v4
        with:
          name: tma-cardiorespiratory-evolution
          path: research/tma_cardioresp_evolution_results/
          if-no-files-found: error
      - name: Commit results
        run: |
          git config user.name 'TMA research bot'
          git config user.email 'actions@users.noreply.github.com'
          git add research/tma_cardioresp_evolution_results/
          if ! git diff --cached --quiet; then
            git commit -m 'Archive cardio-respiratory temporal evolution test'
            git push origin HEAD:research-tma-cardioresp-evolution-20261008
          fi
