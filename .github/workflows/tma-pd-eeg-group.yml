name: PD vs HC EEG TMA

on:
  push:
    branches: [tma-pd-eeg-group-20260926]
    paths:
      - 'research/tma_pd_eeg_group.py'
      - '.github/workflows/tma-pd-eeg-group.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'numpy>=2,<3' 'pandas>=2,<3' 'scipy>=1.14,<2' 'requests>=2.32,<3' 'statsmodels>=0.14,<1'
      - name: Run PD vs HC EEG TMA
        run: PYTHONPATH=.:research python research/tma_pd_eeg_group.py
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: tma-pd-eeg-group-results
          path: research/tma_pd_eeg_group_results/
          if-no-files-found: error
      - name: Commit results
        run: |
          git config user.name 'TMA analysis bot'
          git config user.email 'actions@users.noreply.github.com'
          git add research/tma_pd_eeg_group_results/
          if ! git diff --cached --quiet; then
            git commit -m 'Add PD-vs-HC EEG TMA results'
            git pull --rebase origin tma-pd-eeg-group-20260926
            git push origin HEAD:tma-pd-eeg-group-20260926
          fi
