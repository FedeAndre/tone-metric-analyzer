name: Inspect EEAHR EEG rhythm behavioral archive feasibility
on:
  push:
    branches: [research-tma-eeahr-auditory-20261008]
    paths:
      - research/tma_eeahr_inspect.py
      - .github/workflows/tma-eeahr-inspect.yml
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests
      - run: python research/tma_eeahr_inspect.py
