name: TMA physiology Fantasia analysis optimized

on:
  push:
    branches:
      - tma-physio-analysis-20260917
    paths:
      - 'research/tma_physio_fantasia.py'
      - '.github/workflows/tma-physio-fantasia-fast.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install analysis dependencies
        run: python -m pip install --upgrade pip && pip install 'wfdb>=4.2,<5' 'numpy>=2,<3' 'pandas>=2,<3' 'scipy>=1.14,<2' 'scikit-learn>=1.6,<2'
      - name: Run optimized Fantasia TMA analysis
        run: python research/tma_physio_fantasia.py
      - name: Upload compact results
        uses: actions/upload-artifact@v4
        with:
          name: tma-physio-fantasia-results-optimized
          path: research/tma_physio_results/
          if-no-files-found: error
      - name: Commit compact result tables to analysis branch
        run: |
          git config user.name 'TMA analysis bot'
          git config user.email 'actions@users.noreply.github.com'
          git add research/tma_physio_results
          if ! git diff --cached --quiet; then
            git commit -m 'Add optimized Fantasia TMA physiology results'
            git push origin HEAD:tma-physio-analysis-20260917
          fi
