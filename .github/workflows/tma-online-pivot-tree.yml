name: Verify online pivot confirmations and predecessor trees
on:
  push:
    branches: [research-tma-online-measurement-20261008]
    paths: ['research/tma_online_pivot_tree.py','.github/workflows/tma-online-pivot-tree.yml']
  workflow_dispatch:
permissions: {contents: write}
jobs:
  assess:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install 'numpy>=2,<3' 'pandas>=2,<3' 'scipy>=1.14,<2' 'scikit-learn>=1.5,<2' 'requests>=2.32,<3' 'mido>=1.3,<2'
      - run: PYTHONPATH=.:research python research/tma_online_pivot_tree.py
      - uses: actions/upload-artifact@v4
        with:
          name: TMA-causal-pivot-tree-benchmark
          path: research/tma_online_measurement_results/causal_pivot_tree.json
          if-no-files-found: error
      - name: Archive results
        run: |
          git config user.name 'TMA research bot'
          git config user.email 'actions@users.noreply.github.com'
          git add research/tma_online_measurement_results/causal_pivot_tree.json
          if ! git diff --cached --quiet; then
            git commit -m 'Validate causal TMA pivot and tree event economy'
            git pull --rebase origin research-tma-online-measurement-20261008
            git push origin HEAD:research-tma-online-measurement-20261008
          fi
