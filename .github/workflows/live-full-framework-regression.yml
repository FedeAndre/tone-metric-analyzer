name: Live full-score Railway regression
on:
  push:
    branches:
      - live-full-framework-regression-20260914
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download byte-identical regression PDFs
        shell: bash
        run: |
          set -euo pipefail
          curl -A 'Mozilla/5.0' -fL --retry 4 --retry-delay 2 -o berg.pdf 'https://s9.imslp.org/files/imglnks/usimg/d/d4/IMSLP02556-Berg_-_Piano_Sonata_Op.1.pdf'
          test "$(stat -c%s berg.pdf)" = "579006"
          echo '815d95242d6e2076866594174617361c87373bce7e1642b66812240a3aef400c  berg.pdf' | sha256sum -c -
          curl -fL --retry 4 --retry-delay 2 -o bwv661.pdf 'https://www.mutopiaproject.org/ftp/BachJS/BWV661/bwv661/bwv661-a4.pdf'
          test "$(stat -c%s bwv661.pdf)" = "101270"
          echo 'd50205f28f876126a272ef854e17543d877020e3cd6a106678cdbf5e954502bc  bwv661.pdf' | sha256sum -c -
      - name: Development health
        run: curl -fsS 'https://tone-metric-analyzer-development-production.up.railway.app/api/status'
      - name: Exact full-score Berg live regression
        shell: bash
        run: |
          set -euo pipefail
          start=$(date +%s)
          code=$(curl --silent --show-error --max-time 600 -w '%{http_code}' \
            -F file=@berg.pdf -F meter_override=auto \
            'https://tone-metric-analyzer-development-production.up.railway.app/api/analyze' \
            -o berg-live.json)
          elapsed=$(( $(date +%s) - start ))
          echo "BERG HTTP=$code elapsed=${elapsed}s bytes=$(stat -c%s berg-live.json)"
          test "$code" = "200"
          python3 - <<'PY'
          import json
          d=json.load(open('berg-live.json'))
          events=[e for s in d.get('segments',[]) for e in s.get('events',[])]
          missing=[e for e in events if not e.get('tone_metric_levels')]
          meta=d.get('canonical_score_meta') or {}
          po=d.get('physical_overlay') or {}; m=po.get('matching') or {}
          pages={int(p.get('page_index')):p for p in po.get('pages',[])}
          summary={
            'measures':len(d.get('measures',[])), 'symbolic':d.get('symbolic_hit_count'),
            'canonical':d.get('canonical_hit_count'), 'events':len(events),
            'missing_levels':len(missing), 'max_level':d.get('max_level'),
            'musicxml_measures':meta.get('musicxml_measure_count'),
            'omr_stacks':meta.get('omr_measure_stack_count'),
            'framework_measures':meta.get('framework_measure_count'),
            'synthesized':meta.get('synthesized_measure_count'),
            'physical':po.get('available'),
            'page8_layers':len(pages.get(7,{}).get('layer_anchors',[])),
            'page9_layers':len(pages.get(8,{}).get('layer_anchors',[])),
            'page9_trees':len(pages.get(8,{}).get('tree_nodes',[])),
            'structural_missing':m.get('structural_parenthetical_labels_missing'),
          }
          print(json.dumps(summary,indent=2))
          assert d.get('analysis_hit_source')=='canonical-score-time'
          assert len(d.get('measures',[]))==175
          assert d['measures'][0]['number']=='1' and d['measures'][-1]['number']=='175'
          assert d.get('symbolic_hit_count')==859
          assert d.get('canonical_hit_count')==1724
          assert len(events)==1724 and len(missing)==0
          assert d.get('max_level')==16
          assert meta.get('musicxml_measure_count')==136
          assert meta.get('omr_measure_stack_count')==175
          assert meta.get('framework_measure_count')==175
          assert meta.get('framework_reconciled') is True
          assert meta.get('synthesized_measure_count')==39
          assert meta.get('measure_count')==175
          assert not any('more measure stacks than the canonical MusicXML framework' in str(w) for w in meta.get('warnings',[]))
          assert po.get('available') is True
          assert len(pages.get(7,{}).get('layer_anchors',[]))==215
          assert len(pages.get(8,{}).get('layer_anchors',[]))==196
          assert len(pages.get(8,{}).get('tree_nodes',[]))==196
          assert m.get('structural_parenthetical_labels_missing')==0
          print('LIVE FULL-SCORE BERG: PASS')
          PY
      - name: Exact BWV 661 live regression
        shell: bash
        run: |
          set -euo pipefail
          start=$(date +%s)
          code=$(curl --silent --show-error --max-time 600 -w '%{http_code}' \
            -F file=@bwv661.pdf -F meter_override=auto \
            'https://tone-metric-analyzer-development-production.up.railway.app/api/analyze' \
            -o bwv-live.json)
          elapsed=$(( $(date +%s) - start ))
          echo "BWV HTTP=$code elapsed=${elapsed}s bytes=$(stat -c%s bwv-live.json)"
          test "$code" = "200"
          python3 - <<'PY'
          import json
          d=json.load(open('bwv-live.json'))
          events=[e for s in d.get('segments',[]) for e in s.get('events',[])]
          po=d.get('physical_overlay') or {}; m=po.get('matching') or {}; meta=d.get('canonical_score_meta') or {}
          summary={'measures':len(d.get('measures',[])),'symbolic':d.get('symbolic_hit_count'),'canonical':d.get('canonical_hit_count'),'events':len(events),'levels':d.get('levels_enabled'),'max_level':d.get('max_level'),'physical':po.get('available'),'waves':m.get('wave_profile_points_mapped'),'pivots':m.get('pivot_profile_mapped'),'tree_nodes':m.get('tree_event_nodes_mapped'),'tree_branches':m.get('tree_branches_mapped')}
          print(json.dumps(summary,indent=2))
          assert d.get('analysis_hit_source')=='canonical-score-time'
          assert len(d.get('measures',[]))==92
          assert d.get('symbolic_hit_count')==549
          assert d.get('canonical_hit_count')==733
          assert len(events)==733 and all(e.get('tone_metric_levels') for e in events)
          assert d.get('levels_enabled')==list(range(1,10)) and d.get('max_level')==9
          assert meta.get('omr_measure_stack_count')==92
          assert meta.get('framework_reconciled') is False
          assert po.get('available') is True
          assert m.get('wave_profile_points_mapped')==735
          assert m.get('pivot_profile_mapped')==27
          assert m.get('tree_event_nodes_mapped')==733
          assert m.get('tree_branches_mapped')==732
          print('LIVE EXACT BWV 661: PASS')
          PY
