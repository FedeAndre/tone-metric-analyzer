name: Exact TMA Gait Aging validation
on:
  push:
    branches: [tma-pd-remaining-datasets-20260925]
    paths: ['research/tma_gait_aging_exact.py','.github/workflows/tma-gait-aging-exact.yml','research/tma_clinical_exact_utils.py','tone_metric/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install 'numpy>=2,<3' 'pandas>=2,<3' 'scipy>=1.14,<2' 'requests>=2.32,<3' 'scikit-learn>=1.6,<2'
      - run: PYTHONPATH=. python research/tma_gait_aging_exact.py
      - uses: actions/upload-artifact@v4
        with:
          name: tma-gait-aging-exact-results
          path: research/tma_gait_aging_exact_results/
          if-no-files-found: error
      - name: Commit results
        run: |
          git config user.name 'TMA analysis bot'
          git config user.email 'actions@users.noreply.github.com'
          git add research/tma_gait_aging_exact_results/
          git commit -m 'Add exact TMA Gait Aging results' || exit 0
          git pull --rebase origin tma-pd-remaining-datasets-20260925 || true
          git push origin HEAD:tma-pd-remaining-datasets-20260925 || true
