name: Integrate opening pickup registration
on:
  push:
    branches:
      - pickup-registration-integration-20260914
permissions:
  contents: write
jobs:
  integrate:
    if: github.event.head_commit.message == 'Bootstrap opening pickup registration fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply dissertation pickup registration correction
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib

          p=Path('tone_metric/score_registration.py')
          text=p.read_text()

          needle='''def build_layer_anchors_from_canonical_score(analysis_result: dict, page_dimensions: dict[int, tuple[float, float]]):\n    """Build exact attack anchors plus dissertation-style parenthetical anchors."""\n'''
          helper='''def _pre_pickup_structural_layout_position(\n    measure_meta: dict,\n    metric_offset: Fraction,\n    pickup_shift: Fraction,\n) -> tuple[float | None, str, float]:\n    """Place an opening pre-pickup structural articulation before the first attack.\n\n    ``metric_offset`` is measured in the complete underlying metric measure, while\n    canonical notation columns in an anacrustic measure begin at local score time 0\n    for the first printed pickup event.  The dissertation nevertheless preserves the\n    silent metric articulation(s) that precede that event and renders their Levels in\n    parentheses.  This helper maps those *already-generated* structural times only;\n    it never creates attacks or changes tone-metric timing.\n\n    The available horizontal space from the canonical measure boundary to the first\n    printed column represents the silent pre-pickup portion.  Multiple structural\n    points retain their chronological order within that space.\n    """\n    if pickup_shift <= 0 or metric_offset < 0 or metric_offset >= pickup_shift:\n        return None, "pre-pickup-structural-time-unavailable", 0.0\n\n    left = float(measure_meta.get("stack_left", 0.0) or 0.0)\n    right = float(measure_meta.get("stack_right", left + 1.0) or (left + 1.0))\n    xs = []\n    for col in measure_meta.get("columns", []):\n        try:\n            xs.append(float(col.get("x_abs")))\n        except Exception:\n            pass\n    if xs:\n        first_x = min(xs)\n        visual_left = min(max(left + 1.0, left), max(left, first_x - 1.0))\n        if first_x > visual_left:\n            ratio = float(metric_offset / pickup_shift)\n            x = visual_left + ratio * (first_x - visual_left)\n            return x, "opening-pickup-pre-attack-metric-layout", 0.90\n\n    if right > left:\n        ratio = float(metric_offset / pickup_shift)\n        x = left + 1.0 + ratio * max(0.0, right - left - 2.0)\n        return x, "opening-pickup-measure-layout-fallback", 0.62\n    return None, "pre-pickup-structural-time-unavailable", 0.0\n\n\n'''
          if text.count(needle) != 1:
              raise SystemExit('build_layer insertion point mismatch')
          text=text.replace(needle, helper+needle, 1)

          old='''        cm = measure_meta.get(mi)\n        if cm is None or local_time < 0 or local_time >= m["full"]:\n            for level in target["levels"]:\n                structural_per_level[level]["missing"] += 1\n                structural_missing[level].append({\n                    "measure_index": mi,\n                    "measure_number": m["number"],\n                    "offset_in_measure_quarter": str(offset),\n                    "reason": "canonical-measure-layout-not-found" if cm is None else "structural-time-outside-printable-measure",\n                })\n            continue\n'''
          new='''        cm = measure_meta.get(mi)\n        is_opening_pre_pickup = (\n            mi == 0\n            and m["shift"] > 0\n            and Fraction(0) <= offset < m["shift"]\n        )\n        if cm is None or ((local_time < 0 and not is_opening_pre_pickup) or local_time >= m["full"]):\n            for level in target["levels"]:\n                structural_per_level[level]["missing"] += 1\n                structural_missing[level].append({\n                    "measure_index": mi,\n                    "measure_number": m["number"],\n                    "offset_in_measure_quarter": str(offset),\n                    "reason": "canonical-measure-layout-not-found" if cm is None else "structural-time-outside-printable-measure",\n                })\n            continue\n'''
          if text.count(old) != 1:
              raise SystemExit('negative-time rejection block mismatch')
          text=text.replace(old,new,1)

          old='''        x_abs, source, confidence, exact_col = _structural_layout_position(cm, local_time)\n        if x_abs is None:\n'''
          new='''        if is_opening_pre_pickup:\n            x_abs, source, confidence = _pre_pickup_structural_layout_position(\n                cm, offset, m["shift"]\n            )\n            exact_col = None\n        else:\n            x_abs, source, confidence, exact_col = _structural_layout_position(cm, local_time)\n        if x_abs is None:\n'''
          if text.count(old) != 1:
              raise SystemExit('layout block mismatch')
          text=text.replace(old,new,1)

          old='''        reason = _structural_reason(cm, local_time, exact_col)\n'''
          new='''        reason = (\n            "opening-pickup-pre-attack-metric-position"\n            if is_opening_pre_pickup\n            else _structural_reason(cm, local_time, exact_col)\n        )\n'''
          if text.count(old) != 1:
              raise SystemExit('reason block mismatch')
          text=text.replace(old,new,1)
          p.write_text(text)

          got=hashlib.sha256(p.read_bytes()).hexdigest()
          want='1115f2c46d29ce1d2b1e381446d5d0e65b29078d31459f2c5027bd01f6e61a5e'
          if got != want:
              raise SystemExit(f'score_registration sha mismatch: {got} != {want}')

          m=Path('v0152_sha256.txt')
          lines=[]
          for line in m.read_text().splitlines():
              if line.endswith('  tone_metric/score_registration.py'):
                  line=f'{want}  tone_metric/score_registration.py'
              lines.append(line)
          m.write_text('\n'.join(lines)+'\n')
          PY
      - name: Compile and verify opening pickup parenthetical registration
        run: |
          python -m pip install -q -r requirements.txt
          python -m py_compile app.py tone_metric/*.py
          python - <<'PY'
          from tone_metric.score_registration import build_layer_anchors_from_canonical_score
          columns=[{
              'page_index':0,'system_index':0,'x_abs':300.0,'y_abs':100.0,
              'onset_quarter':'0','attack':True,'rest':False,
              'tie_continuation_only':False,'chord_ids':['pickup'],
              'timing_source':'semantic-begin-anchor','confidence':0.96,
              'notation_events':[],
          }]
          result={
              'measures':[{'index':0,'number':'1','start_quarter':'0','end_quarter':'4','full_duration_quarter':'4','pickup_shift_quarter':'3'}],
              'segments':[{'segment_end_quarter':'4','events':[{
                  'event_index':0,'measure_index':0,'measure_number':'1','onset_quarter':'3',
                  'offset_in_measure_quarter':'3','duration_quarter':'1','tone_metric_levels':[2],
                  'attack_key':'0:3'}],
                  'structural_points':[
                      {'time_quarter':'0','levels':[1],'height':1},
                      {'time_quarter':'1','levels':[1],'height':1},
                      {'time_quarter':'2','levels':[1,2],'height':2},
                      {'time_quarter':'3','levels':[2],'height':2},
                  ]}],
              'canonical_score_meta':{'available':True,'column_count':1,'attack_column_count':1,'measures':[{
                  'global_measure_index':0,'measure_number':'1','page_index':0,'system_index':0,
                  'stack_index_in_system':0,'stack_left':80.0,'stack_right':340.0,
                  'full_duration_quarter':'4','columns':columns}], 'warnings':[]},
          }
          attacks, structural, stats, warnings=build_layer_anchors_from_canonical_score(result,{0:(500,300)})
          assert len(attacks[0]) == 1 and attacks[0][0]['recovered_x_abs'] == 300.0
          rows=structural[0]
          assert [r['offset_in_measure_quarter'] for r in rows] == ['0','1','2']
          xs=[r['recovered_x_abs'] for r in rows]
          assert xs == sorted(xs) and all(80.0 < x < 300.0 for x in xs)
          assert all(r['parenthetical'] is True for r in rows)
          assert all(r['structural_reason']=='opening-pickup-pre-attack-metric-position' for r in rows)
          assert stats['structural_parenthetical_labels_missing']==0
          assert not warnings
          print('Opening pickup registration: PASS')
          PY
      - name: Override and file-diff audit
        run: |
          sha256sum -c v0152_sha256.txt
          test "$(grep -R '^def build_layer_anchors_from_canonical_score' -n tone_metric | wc -l)" -eq 1
          test "$(grep -R '^def _pre_pickup_structural_layout_position' -n tone_metric | wc -l)" -eq 1
          test ! -e tone_metric/omr_exact.py
          test ! -e validate_release.py
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' tone_metric/score_registration.py v0152_sha256.txt | sort)"
          test "$changed" = "$expected"
      - name: Commit integrated runtime and remove bootstrap workflow
        run: |
          rm -f .github/workflows/integrate-pickup-registration.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Preserve dissertation opening-pickup parenthetical articulations"
          git push origin HEAD:pickup-registration-integration-20260914
