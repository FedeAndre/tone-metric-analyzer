name: TMA frozen raw cross-domain comparator

on:
  push:
    branches: [tma-cross-domain-frozen-20260924]
    paths:
      - 'research/tma_cross_domain_frozen.py'
      - '.github/workflows/tma-cross-domain-frozen.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'numpy>=2,<3' 'pandas>=2,<3' 'scipy>=1.14,<2' 'requests>=2.32,<3' 'scikit-learn>=1.6,<2' 'wfdb>=4.2,<5' 'h5py>=3.12,<4'
      - name: Run frozen raw comparator
        run: PYTHONPATH=.:research python research/tma_cross_domain_frozen.py
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: tma-cross-domain-frozen-results
          path: research/tma_cross_domain_frozen_results/
          if-no-files-found: error
      - name: Commit results
        run: |
          git config user.name 'TMA analysis bot'
          git config user.email 'actions@users.noreply.github.com'
          git add research/tma_cross_domain_frozen_results/
          if ! git diff --cached --quiet; then
            git commit -m 'Add frozen raw cross-domain TMA results'
            git pull --rebase origin tma-cross-domain-frozen-20260924
            git push origin HEAD:tma-cross-domain-frozen-20260924
          fi
