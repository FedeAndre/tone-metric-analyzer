name: TMA physiology Fantasia local-prefetch

on:
  push:
    branches:
      - tma-physio-analysis-20260917
    paths:
      - 'research/tma_physio_fantasia.py'
      - '.github/workflows/tma-physio-fantasia-local.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install analysis dependencies
        run: python -m pip install --upgrade pip && pip install 'wfdb>=4.2,<5' 'numpy>=2,<3' 'pandas>=2,<3' 'scipy>=1.14,<2' 'scikit-learn>=1.6,<2'
      - name: Download Fantasia once
        run: |
          wget -q -O /tmp/fantasia.zip https://physionet.org/content/fantasia/get-zip/1.0.0/
          mkdir -p /tmp/fantasia
          unzip -q /tmp/fantasia.zip -d /tmp/fantasia
          DATA_DIR="$(dirname "$(find /tmp/fantasia -type f -name f1y01.hea | head -1)")"
          test -n "$DATA_DIR"
          test -f "$DATA_DIR/f1o01.dat"
          test -f "$DATA_DIR/f2y10.ecg"
          echo "FANTASIA_DIR=$DATA_DIR" >> "$GITHUB_ENV"
          echo "Fantasia local directory: $DATA_DIR"
      - name: Run optimized Fantasia TMA analysis
        run: python research/tma_physio_fantasia.py
      - name: Upload compact results
        uses: actions/upload-artifact@v4
        with:
          name: tma-physio-fantasia-results-local
          path: research/tma_physio_results/
          if-no-files-found: error
      - name: Commit compact result tables to analysis branch
        run: |
          git config user.name 'TMA analysis bot'
          git config user.email 'actions@users.noreply.github.com'
          git add research/tma_physio_results
          if ! git diff --cached --quiet; then
            git commit -m 'Add local-prefetch Fantasia TMA physiology results'
            git push origin HEAD:tma-physio-analysis-20260917
          fi
