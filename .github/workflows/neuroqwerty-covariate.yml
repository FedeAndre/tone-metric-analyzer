name: neuroQWERTY severity covariate check
on:
  push:
    branches: [tma-pd-remaining-datasets-20260925]
    paths: ['research/neuroqwerty_covariate.py','.github/workflows/neuroqwerty-covariate.yml']
permissions: {contents: write}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install numpy pandas scipy
      - run: python research/neuroqwerty_covariate.py
      - run: |
          git config user.name 'TMA analysis bot'
          git config user.email 'actions@users.noreply.github.com'
          git add research/tma_neuroqwerty_exact_results/updrs_adjusted.json
          git commit -m 'Add neuroQWERTY severity covariate check' || exit 0
          git pull --rebase origin tma-pd-remaining-datasets-20260925 || true
          git push origin HEAD:tma-pd-remaining-datasets-20260925 || true
