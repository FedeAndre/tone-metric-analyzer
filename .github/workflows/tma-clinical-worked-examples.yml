name: TMA clinical worked examples
on:
  push:
    branches: [tma-cross-domain-frozen-20260924]
    paths:
      - 'research/tma_clinical_worked_examples.py'
      - '.github/workflows/tma-clinical-worked-examples.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          pip install 'numpy>=2,<3' 'pandas>=2,<3' 'scipy>=1.14,<2' 'requests>=2.32,<3'
      - name: Generate worked examples
        run: PYTHONPATH=.:research python research/tma_clinical_worked_examples.py
      - uses: actions/upload-artifact@v4
        with:
          name: tma-clinical-worked-examples
          path: research/tma_clinical_worked_examples/
      - name: Commit worked examples
        run: |
          git config user.name 'TMA analysis bot'
          git config user.email 'actions@users.noreply.github.com'
          git add research/tma_clinical_worked_examples/
          if ! git diff --cached --quiet; then
            git commit -m 'Add TMA clinical worked examples'
            git pull --rebase origin tma-cross-domain-frozen-20260924
            git push origin HEAD:tma-cross-domain-frozen-20260924
          fi
