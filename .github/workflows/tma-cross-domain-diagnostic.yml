name: TMA cross-domain source diagnostic

on:
  push:
    branches:
      - tma-cross-domain-frozen-20260924
    paths:
      - 'research/cross_domain_source_diagnostic.py'
      - '.github/workflows/tma-cross-domain-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install 'requests>=2.32,<3' 'scipy>=1.14,<2'
      - name: Inspect public sources
        run: python research/cross_domain_source_diagnostic.py
      - name: Commit diagnostic
        run: |
          git config user.name 'TMA analysis bot'
          git config user.email 'actions@users.noreply.github.com'
          git add research/tma_cross_domain_diagnostic/REPORT.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Add cross-domain source diagnostic results'
            git push origin HEAD:tma-cross-domain-frozen-20260924
          fi
