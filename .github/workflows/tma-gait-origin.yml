name: Fixed-origin fractal gait validation
on:
  push:
    branches: [research-gait-origin-fast-20261008]
    paths:
      - 'research/tma_gait_origin_validation.py'
      - '.github/workflows/tma-gait-origin.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install 'numpy>=2,<3' 'pandas>=2,<3' 'scipy>=1.14,<2' 'requests>=2.32,<3' 'scikit-learn>=1.5,<2' 'statsmodels>=0.14,<1'
      - name: Execute fixed-origin gait test
        run: PYTHONPATH=.:research python research/tma_gait_origin_validation.py
      - name: Archive results
        uses: actions/upload-artifact@v4
        with:
          name: tma-gait-origin-results
          path: research/tma_gait_origin_results/
          if-no-files-found: error
      - name: Commit independent research results
        run: |
          git config user.name 'TMA research bot'
          git config user.email 'actions@users.noreply.github.com'
          git add research/tma_gait_origin_results/
          if ! git diff --cached --quiet; then
            git commit -m 'Record fixed-origin TMA gait validation results'
            git push origin HEAD:research-gait-origin-fast-20261008
          fi
