name: Fractal-coordinate gait spectrum against raw event phase controls
on:
  push:
    branches: [research-tma-phase-control-20261008]
    paths: ['research/tma_phase_control.py','.github/workflows/tma-phase-control.yml']
  workflow_dispatch:
permissions: {contents: write}
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install 'numpy>=2,<3' 'pandas>=2,<3' 'scipy>=1.14,<2' 'scikit-learn>=1.5,<2' 'requests>=2.32,<3'
      - name: Compare original gait phase distributions against fractal expected spectrum
        run: PYTHONPATH=.:research python research/tma_phase_control.py
      - uses: actions/upload-artifact@v4
        with:
          name: tma-phase-controls
          path: research/tma_individual_fingerprint_results/phase_control*
          if-no-files-found: error
      - name: Archive verified results
        run: |
          git config user.name 'TMA research bot'
          git config user.email 'actions@users.noreply.github.com'
          git add research/tma_individual_fingerprint_results/phase_control_results.json
          if ! git diff --cached --quiet; then
            git commit -m 'Compare phase histogram individual signatures with expected TMA spectra'
            git push origin HEAD:research-tma-phase-control-20261008
          fi
