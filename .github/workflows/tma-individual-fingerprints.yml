name: TMA Individual Fourier Fingerprints and PD Clinical Severity
on:
  push:
    branches: [research-tma-individual-fast-20261008]
    paths:
      - research/tma_individual_fingerprint.py
      - .github/workflows/tma-individual-fingerprints.yml
  workflow_dispatch:
permissions: {contents: write}
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numeric and TMA dependencies
        run: python -m pip install --upgrade pip && pip install 'numpy>=2,<3' 'pandas>=2,<3' 'scipy>=1.14,<2' 'requests>=2.32,<3' 'scikit-learn>=1.5,<2' 'statsmodels>=0.14,<1'
      - name: Analyze individual spectral identity and PD severity
        run: PYTHONPATH=.:research python research/tma_individual_fingerprint.py
      - name: Archive validated results
        uses: actions/upload-artifact@v4
        with:
          name: tma-individual-fourier-clinical-results
          path: research/tma_individual_fingerprint_results/
          if-no-files-found: error
      - name: Commit clinical result summaries and participant features
        run: |
          git config user.name 'TMA research bot'
          git config user.email 'actions@users.noreply.github.com'
          git add research/tma_individual_fingerprint_results/
          if ! git diff --cached --quiet; then
            git commit -m 'Archive individual TMA spectral identity and severity validation'
            git push origin HEAD:research-tma-individual-fast-20261008
          fi
