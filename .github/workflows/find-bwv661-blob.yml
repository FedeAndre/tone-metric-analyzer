name: Find exact BWV661 fixture blob

on:
  push:
    branches: [inspect-v0152-runtime]
    paths: ['.github/workflows/find-bwv661-blob.yml']

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan every reachable Git blob by exact SHA-256
        shell: bash
        run: |
          set -euo pipefail
          target='d50205f28f876126a272ef854e17543d877020e3cd6a106678cdbf5e954502bc'
          found=''
          git rev-list --objects --all | awk '{print $1}' | sort -u > /tmp/objects.txt
          while read -r obj; do
            [ "$(git cat-file -t "$obj" 2>/dev/null || true)" = blob ] || continue
            size="$(git cat-file -s "$obj")"
            [ "$size" = 101270 ] || continue
            sha="$(git cat-file blob "$obj" | sha256sum | awk '{print $1}')"
            echo "candidate $obj size=$size sha256=$sha"
            if [ "$sha" = "$target" ]; then
              echo "EXACT_BWV661_BLOB=$obj"
              found="$obj"
              break
            fi
          done < /tmp/objects.txt
          if [ -z "$found" ]; then
            echo 'EXACT_BWV661_BLOB=NOT_FOUND'
            exit 1
          fi
