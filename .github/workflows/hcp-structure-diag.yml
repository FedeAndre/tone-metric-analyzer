name: HCP structure diagnostic
on:
  push:
    branches: [tma-cross-domain-frozen-20260924]
    paths: ['research/hcp_structure_diag.py','.github/workflows/hcp-structure-diag.yml']
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests
      - run: python research/hcp_structure_diag.py
