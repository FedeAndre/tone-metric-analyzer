name: TMA gait primary independent-session test-retest

on:
  push:
    branches:
      - tma-gait-test-retest-20260929
    paths:
      - 'research/tma_gait_test_retest_primary.py'
      - '.github/workflows/tma-gait-test-retest-primary.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install 'numpy>=2,<3' 'pandas>=2,<3' 'scipy>=1.14,<2' 'requests>=2.32,<3'
      - name: Run primary frozen gait test-retest
        run: PYTHONPATH=.:research python research/tma_gait_test_retest_primary.py
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: tma-gait-test-retest-primary-results
          path: research/tma_gait_test_retest_primary_results/
          if-no-files-found: error
      - name: Commit results
        run: |
          git config user.name 'TMA analysis bot'
          git config user.email 'actions@users.noreply.github.com'
          git add research/tma_gait_test_retest_primary_results
          if ! git diff --cached --quiet; then
            git commit -m 'Add primary gait test-retest results'
            git push origin HEAD:tma-gait-test-retest-20260929
          fi
