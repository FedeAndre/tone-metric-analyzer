name: Locate exact memory dependence of frozen TMA Levels
on:
  push:
    branches: [research-tma-online-measurement-20261008]
    paths: ['research/tma_structural_dependency.py','.github/workflows/tma-structural-dependency.yml']
  workflow_dispatch:
permissions: {contents: write}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install 'numpy>=2,<3' 'pandas>=2,<3' 'scipy>=1.14,<2' 'scikit-learn>=1.5,<2' 'requests>=2.32,<3' 'mido>=1.3,<2'
      - run: PYTHONPATH=.:research python research/tma_structural_dependency.py
      - uses: actions/upload-artifact@v4
        with:
          name: frozen-TMA-structural-dependency-audit
          path: research/tma_online_measurement_results/structural_dependency.json
          if-no-files-found: error
      - name: Commit findings
        run: |
          git config user.name 'TMA research bot'
          git config user.email 'actions@users.noreply.github.com'
          git add research/tma_online_measurement_results/structural_dependency.json
          if ! git diff --cached --quiet; then
            git commit -m 'Audit cross-beat Level invariance and global tree dependence'
            git push origin HEAD:research-tma-online-measurement-20261008
          fi
