name: Inspect TremorDB format
on:
  push:
    branches: [tma-tremordb-exact-20260925]
    paths: ['research/inspect_tremordb.py','.github/workflows/inspect-tremordb.yml']
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests numpy
      - run: python research/inspect_tremordb.py
