name: Inspect EEAHR original 190-second human rhythmic events
on:
  push:
    branches: [research-tma-eeahr-auditory-20261008]
    paths:
      - research/tma_eeahr_original_archive.py
      - .github/workflows/tma-eeahr-original-archive.yml
  workflow_dispatch:
permissions: {contents: write}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install RAR extraction backend
        run: sudo apt-get update -qq && sudo apt-get install -y -qq unar
      - name: Install analysis dependencies
        run: pip install 'numpy>=2,<3' 'pandas>=2,<3' 'scipy>=1.14,<2' 'scikit-learn>=1.5,<2' 'requests>=2.32,<3' 'rarfile>=4.2,<5'
      - name: Verify and inspect publicly available rhythmic event files
        run: PYTHONPATH=.:research python research/tma_eeahr_original_archive.py
      - uses: actions/upload-artifact@v4
        with:
          name: eeahr-auditory-original-event-inspection
          path: research/tma_eeahr_results/event_archive_inspection.json
          if-no-files-found: error
      - name: Commit metadata inspection
        run: |
          git config user.name 'TMA research bot'
          git config user.email 'actions@users.noreply.github.com'
          git add research/tma_eeahr_results/event_archive_inspection.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record verified real auditory EEG tapping event dataset layout'
            git push origin HEAD:research-tma-eeahr-auditory-20261008
          fi
