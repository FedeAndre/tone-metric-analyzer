name: TMA Within-Walk Temporal Evolution
on:
  push:
    branches: [research-tma-temporal-evolution-20261008]
    paths: ['research/tma_within_walk_evolution.py', '.github/workflows/tma-within-walk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install
        run: python -m pip install --upgrade pip && pip install 'numpy>=2,<3' 'pandas>=2,<3' 'scipy>=1.14,<2' 'requests>=2.32,<3' 'scikit-learn>=1.5,<2'
      - name: Gait evolution test
        run: PYTHONPATH=.:research python research/tma_within_walk_evolution.py
      - uses: actions/upload-artifact@v4
        with:
          name: tma-gait-temporal-evolution
          path: research/tma_temporal_evolution_results/
          if-no-files-found: error
      - name: Commit results
        run: |
          git config user.name 'TMA research bot'
          git config user.email 'actions@users.noreply.github.com'
          git add research/tma_temporal_evolution_results/
          if ! git diff --cached --quiet; then
            git commit -m 'Archive within-walk temporal evolution validation'
            git push origin HEAD:research-tma-temporal-evolution-20261008
          fi
