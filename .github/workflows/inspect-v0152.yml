name: Inspect v0.15.2 runtime archive

on:
  push:
    branches:
      - inspect-v0152-runtime
    paths:
      - .github/workflows/inspect-v0152.yml

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enumerate all historical transfer and chunk files
        shell: bash
        run: |
          python3 - <<'PY'
          import re, subprocess
          commits=subprocess.check_output(['git','rev-list','--all'], text=True).splitlines()
          seen=set()
          pats=('chunk','part','b64','base64','transport','v0152','v0_15_2','0_15_2','0152','transfer')
          print('TRANSFER_PATHS_BEGIN')
          for commit in commits:
              rows=subprocess.check_output(['git','ls-tree','-r',commit],text=True,errors='replace').splitlines()
              for row in rows:
                  try:
                      meta,path=row.split('\t',1)
                      _,typ,blob=meta.split()
                  except ValueError:
                      continue
                  if typ!='blob': continue
                  low=path.lower()
                  if any(p in low for p in pats):
                      key=(blob,path)
                      if key in seen: continue
                      seen.add(key)
                      size=int(subprocess.check_output(['git','cat-file','-s',blob],text=True).strip())
                      print(commit, blob, size, path)
          print('TRANSFER_PATHS_END')
          PY
