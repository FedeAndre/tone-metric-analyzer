name: Retry opening pickup registration
on:
  push:
    branches:
      - pickup-registration-integration-20260914
permissions:
  contents: write
jobs:
  integrate:
    if: github.event.head_commit.message == 'Retry exact opening pickup registration fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact locally validated patch
        run: |
          cat > /tmp/pickup.patch <<'PATCH'
          --- a/tone_metric/score_registration.py
          +++ b/tone_metric/score_registration.py
          @@ -213,6 +213,50 @@
               return x, source, 0.58 if not columns else 0.64, None
           
           
          +def _pre_pickup_structural_layout_position(
          +    measure_meta: dict,
          +    metric_offset: Fraction,
          +    pickup_shift: Fraction,
          +) -> tuple[float | None, str, float]:
          +    """Place an opening pre-pickup structural articulation before the first attack.
          +
          +    ``metric_offset`` is measured in the complete underlying metric measure, while
          +    canonical notation columns in an anacrustic measure begin at local score time 0
          +    for the first printed pickup event.  The dissertation nevertheless preserves the
          +    silent metric articulation(s) that precede that event and renders their Levels in
          +    parentheses.  This helper maps those *already-generated* structural times only;
          +    it never creates attacks or changes tone-metric timing.
          +
          +    The available horizontal space from the canonical measure boundary to the first
          +    printed column represents the silent pre-pickup portion.  Multiple structural
          +    points retain their chronological order within that space.
          +    """
          +    if pickup_shift <= 0 or metric_offset < 0 or metric_offset >= pickup_shift:
          +        return None, "pre-pickup-structural-time-unavailable", 0.0
          +
          +    left = float(measure_meta.get("stack_left", 0.0) or 0.0)
          +    right = float(measure_meta.get("stack_right", left + 1.0) or (left + 1.0))
          +    xs = []
          +    for col in measure_meta.get("columns", []):
          +        try:
          +            xs.append(float(col.get("x_abs")))
          +        except Exception:
          +            pass
          +    if xs:
          +        first_x = min(xs)
          +        visual_left = min(max(left + 1.0, left), max(left, first_x - 1.0))
          +        if first_x > visual_left:
          +            ratio = float(metric_offset / pickup_shift)
          +            x = visual_left + ratio * (first_x - visual_left)
          +            return x, "opening-pickup-pre-attack-metric-layout", 0.90
          +
          +    if right > left:
          +        ratio = float(metric_offset / pickup_shift)
          +        x = left + 1.0 + ratio * max(0.0, right - left - 2.0)
          +        return x, "opening-pickup-measure-layout-fallback", 0.62
          +    return None, "pre-pickup-structural-time-unavailable", 0.0
          +
          +
           def build_layer_anchors_from_canonical_score(analysis_result: dict, page_dimensions: dict[int, tuple[float, float]]):
               """Build exact attack anchors plus dissertation-style parenthetical anchors."""
               meta = analysis_result.get("canonical_score_meta") or {}
          @@ -312,7 +356,12 @@
                       structural_per_level[level]["expected"] += 1
           
                   cm = measure_meta.get(mi)
          -        if cm is None or local_time < 0 or local_time >= m["full"]:
          +        is_opening_pre_pickup = (
          +            mi == 0
          +            and m["shift"] > 0
          +            and Fraction(0) <= offset < m["shift"]
          +        )
          +        if cm is None or ((local_time < 0 and not is_opening_pre_pickup) or local_time >= m["full"]):
                       for level in target["levels"]:
                           structural_per_level[level]["missing"] += 1
                           structural_missing[level].append({
          @@ -337,7 +386,13 @@
                           })
                       continue
           
          -        x_abs, source, confidence, exact_col = _structural_layout_position(cm, local_time)
          +        if is_opening_pre_pickup:
          +            x_abs, source, confidence = _pre_pickup_structural_layout_position(
          +                cm, offset, m["shift"]
          +            )
          +            exact_col = None
          +        else:
          +            x_abs, source, confidence, exact_col = _structural_layout_position(cm, local_time)
                   if x_abs is None:
                       for level in target["levels"]:
                           structural_per_level[level]["missing"] += 1
          @@ -349,7 +404,11 @@
                           })
                       continue
           
          -        reason = _structural_reason(cm, local_time, exact_col)
          +        reason = (
          +            "opening-pickup-pre-attack-metric-position"
          +            if is_opening_pre_pickup
          +            else _structural_reason(cm, local_time, exact_col)
          +        )
                   pw, ph = float(dims[0]), float(dims[1])
                   y_abs = float(exact_col.get("y_abs", 0.0)) if exact_col is not None else 0.0
                   row = {
          PATCH
          sed -i 's/^          //' /tmp/pickup.patch
          git apply --check /tmp/pickup.patch
          git apply /tmp/pickup.patch
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('tone_metric/score_registration.py')
          want='ab7c5e2089779ca0640a93bf66446dc8d4cc38f35958c4144f872c47dc9dacfc'
          got=hashlib.sha256(p.read_bytes()).hexdigest()
          assert got == want, (got,want)
          m=Path('v0152_sha256.txt')
          lines=[]
          for line in m.read_text().splitlines():
              if line.endswith('  tone_metric/score_registration.py'):
                  line=f'{want}  tone_metric/score_registration.py'
              lines.append(line)
          m.write_text('\n'.join(lines)+'\n')
          PY
      - name: Compile and synthetic pickup regression
        run: |
          python -m pip install -q -r requirements.txt
          python -m py_compile app.py tone_metric/*.py
          python - <<'PY'
          from tone_metric.score_registration import build_layer_anchors_from_canonical_score
          columns=[{'page_index':0,'system_index':0,'x_abs':300.0,'y_abs':100.0,'onset_quarter':'0','attack':True,'rest':False,'tie_continuation_only':False,'chord_ids':['pickup'],'timing_source':'semantic-begin-anchor','confidence':0.96,'notation_events':[]}]
          result={'measures':[{'index':0,'number':'1','start_quarter':'0','end_quarter':'4','full_duration_quarter':'4','pickup_shift_quarter':'3'}],'segments':[{'segment_end_quarter':'4','events':[{'event_index':0,'measure_index':0,'measure_number':'1','onset_quarter':'3','offset_in_measure_quarter':'3','duration_quarter':'1','tone_metric_levels':[2],'attack_key':'0:3'}],'structural_points':[{'time_quarter':'0','levels':[1],'height':1},{'time_quarter':'1','levels':[1],'height':1},{'time_quarter':'2','levels':[1,2],'height':2},{'time_quarter':'3','levels':[2],'height':2}]}],'canonical_score_meta':{'available':True,'column_count':1,'attack_column_count':1,'measures':[{'global_measure_index':0,'measure_number':'1','page_index':0,'system_index':0,'stack_index_in_system':0,'stack_left':80.0,'stack_right':340.0,'full_duration_quarter':'4','columns':columns}],'warnings':[]}}
          attacks, structural, stats, warnings=build_layer_anchors_from_canonical_score(result,{0:(500,300)})
          assert len(attacks[0])==1 and attacks[0][0]['recovered_x_abs']==300.0
          rows=structural[0]
          assert [r['offset_in_measure_quarter'] for r in rows]==['0','1','2']
          xs=[r['recovered_x_abs'] for r in rows]
          assert xs==sorted(xs) and all(80.0 < x < 300.0 for x in xs)
          assert all(r['parenthetical'] is True for r in rows)
          assert all(r['structural_reason']=='opening-pickup-pre-attack-metric-position' for r in rows)
          assert stats['structural_parenthetical_labels_missing']==0 and not warnings
          print('Opening pickup registration: PASS')
          PY
      - name: Runtime checksum and override audit
        run: |
          sha256sum -c v0152_sha256.txt
          test "$(grep -R '^def build_layer_anchors_from_canonical_score' -n tone_metric | wc -l)" -eq 1
          test "$(grep -R '^def _pre_pickup_structural_layout_position' -n tone_metric | wc -l)" -eq 1
          test ! -e tone_metric/omr_exact.py
          test ! -e validate_release.py
          changed="$(git diff --name-only | grep -v '^.github/workflows/' | sort)"
          expected="$(printf '%s\n' tone_metric/score_registration.py v0152_sha256.txt | sort)"
          test "$changed" = "$expected"
      - name: Commit exact integration
        run: |
          rm -f .github/workflows/integrate-pickup-registration.yml .github/workflows/retry-pickup-registration.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Preserve dissertation opening-pickup parenthetical articulations"
          git push origin HEAD:pickup-registration-integration-20260914
