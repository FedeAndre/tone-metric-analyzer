name: Profile Berg pipeline
on:
  push:
    branches:
      - live-berg-opening-regression-20260914
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Download exact Berg fixture
        shell: bash
        run: |
          set -euo pipefail
          curl -A 'Mozilla/5.0' -fL --retry 4 --retry-delay 2 -o berg.pdf 'https://s9.imslp.org/files/imglnks/usimg/d/d4/IMSLP02556-Berg_-_Piano_Sonata_Op.1.pdf'
          test "$(stat -c%s berg.pdf)" = "579006"
          echo '815d95242d6e2076866594174617361c87373bce7e1642b66812240a3aef400c  berg.pdf' | sha256sum -c -
      - name: Build exact deployed runtime
        run: docker build -t tma-profile .
      - name: Profile stages on exact Berg PDF
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/work" \
            -w /app \
            -e PYTHONPATH=/app \
            tma-profile \
            python3 /work/.github/scripts/profile_pipeline.py /work/berg.pdf
          cat profile-summary.json || true
