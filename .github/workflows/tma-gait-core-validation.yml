name: TMA gait core validation

on:
  push:
    branches:
      - tma-gait-gauge-validation-20260923
    paths:
      - 'research/tma_gait_core_validation.py'
      - '.github/workflows/tma-gait-core-validation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install analysis dependencies
        run: python -m pip install --upgrade pip && pip install 'numpy>=2,<3' 'pandas>=2,<3' 'scipy>=1.14,<2' 'requests>=2.32,<3'
      - name: Run deterministic frozen Ga validation
        run: PYTHONPATH=. python research/tma_gait_core_validation.py
      - name: Upload compact results
        uses: actions/upload-artifact@v4
        with:
          name: tma-gait-core-results
          path: research/tma_gait_gauge_results/
          if-no-files-found: error
      - name: Commit result tables to analysis branch
        run: |
          git config user.name 'TMA analysis bot'
          git config user.email 'actions@users.noreply.github.com'
          git add research/tma_gait_gauge_results
          if ! git diff --cached --quiet; then
            git commit -m 'Add deterministic frozen Ga gait validation results'
            git push origin HEAD:tma-gait-gauge-validation-20260923
          fi
