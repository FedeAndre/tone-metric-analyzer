name: TMA Fourier scale association in Parkinson gait
on:
  push:
    branches: [research-tma-physio-spectral-20261008]
    paths: ['research/tma_gait_band_test.py','.github/workflows/tma-gait-band.yml']
  workflow_dispatch:
permissions: {contents: write}
jobs:
  spectral-gait:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --upgrade pip && pip install 'numpy>=2,<3' 'pandas>=2,<3' 'scipy>=1.14,<2' 'scikit-learn>=1.5,<2' 'statsmodels>=0.14,<1' 'requests>=2.32,<3'
      - run: PYTHONPATH=.:research python research/tma_gait_band_test.py
      - uses: actions/upload-artifact@v4
        with:
          name: tma-gait-disease-frequency-analysis
          path: research/tma_physio_spectral_results/
          if-no-files-found: error
      - name: Commit results
        run: |
          git config user.name 'TMA research bot'
          git config user.email 'actions@users.noreply.github.com'
          git add research/tma_physio_spectral_results/
          if ! git diff --cached --quiet; then
            git commit -m 'Archive PD gait TMA disease-frequency association'
            git push origin HEAD:research-tma-physio-spectral-20261008
