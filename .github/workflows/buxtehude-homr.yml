name: HOMR Buxtehude validation

on:
  push:
    branches:
      - homr-buxtehude-validation-20260918
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct exact score pages from public-domain Sibley source
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          curl -L --fail --retry 3 \
            'https://urresearch.rochester.edu/fileDownloadForInstitutionalItem.action?itemFileId=36184&itemId=15575' \
            -o full.pdf
          pdfseparate -f 105 -l 106 full.pdf page-%d.pdf
          pdfunite page-105.pdf page-106.pdf buxtehude.pdf
          pdfinfo buxtehude.pdf | grep -E 'Pages|Page size'
          mkdir -p homr_pages
          pdftoppm -r 300 -png buxtehude.pdf homr_pages/bux-page >/dev/null 2>&1
          ls -lh buxtehude.pdf homr_pages/*.png

      - name: Build isolated HOMR reader
        run: docker build --progress=plain -t homr-reader-probe .

      - name: Run HOMR on Buxtehude pages
        run: |
          docker run --rm -v "$PWD:/work" -w /work homr-reader-probe homr /work/homr_pages
          ls -lh homr_pages/*.musicxml
          test "$(find homr_pages -maxdepth 1 -name '*.musicxml' | wc -l)" -eq 2

      - name: Emit measure-by-measure attack diagnostics
        run: |
          python3 - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from collections import defaultdict
          from fractions import Fraction
          from pathlib import Path

          def tag(e): return e.tag.rsplit('}',1)[-1]
          def child(e,name):
              for c in e:
                  if tag(c)==name: return c
              return None
          def ctext(e,name,default=''):
              c=child(e,name)
              return (c.text or default).strip() if c is not None else default

          def parse_page(path):
              root=ET.parse(path).getroot()
              parts=[e for e in root if tag(e)=='part']
              events=defaultdict(set)
              note_elements=rests=graces=chord_cont=tie_stops=0
              max_measure=0
              for pi,part in enumerate(parts, start=1):
                  divisions=1
                  measures=[m for m in part if tag(m)=='measure']
                  max_measure=max(max_measure,len(measures))
                  for mi,measure in enumerate(measures,start=1):
                      cursor=Fraction(0)
                      previous_start=Fraction(0)
                      for item in measure:
                          k=tag(item)
                          if k=='attributes':
                              d=ctext(item,'divisions')
                              if d: divisions=max(1,int(d))
                              continue
                          if k=='backup':
                              cursor-=Fraction(int(ctext(item,'duration','0') or 0),divisions)
                              continue
                          if k=='forward':
                              cursor+=Fraction(int(ctext(item,'duration','0') or 0),divisions)
                              continue
                          if k!='note': continue
                          note_elements+=1
                          is_chord=child(item,'chord') is not None
                          is_rest=child(item,'rest') is not None
                          is_grace=child(item,'grace') is not None
                          if is_chord: chord_cont+=1
                          if is_rest: rests+=1
                          if is_grace: graces+=1
                          dur_raw=int(ctext(item,'duration','0') or 0)
                          dur=Fraction(dur_raw,divisions) if dur_raw else Fraction(0)
                          start=previous_start if is_chord else cursor
                          if not is_chord: previous_start=start
                          ties={(c.attrib.get('type') or '').lower() for c in item if tag(c)=='tie'}
                          tie_stop='stop' in ties
                          if tie_stop: tie_stops+=1
                          if not is_rest and not is_grace and not tie_stop:
                              events[mi].add(start)
                          if not is_chord and not is_grace:
                              cursor+=dur
              rows=[]
              for mi in range(1,max_measure+1):
                  offs=sorted(events.get(mi,set()))
                  rows.append({'local_measure':mi,'count':len(offs),'offsets_quarter_units':[str(x) for x in offs]})
              return {
                  'path':str(path),'part_count':len(parts),'measure_count':max_measure,
                  'note_elements':note_elements,'rests':rests,'grace_notes':graces,
                  'chord_continuations':chord_cont,'tie_stops_excluded':tie_stops,
                  'total_attacks':sum(r['count'] for r in rows),'measures':rows
              }

          files=sorted(Path('homr_pages').glob('*.musicxml'))
          assert len(files)==2, files
          pages=[parse_page(p) for p in files]
          physical_counts=[30,19]
          global_rows=[]
          for page_index,(page,phys_count) in enumerate(zip(pages,physical_counts),start=1):
              base=0 if page_index==1 else 30
              for r in page['measures']:
                  global_rows.append({
                      'page':page_index,
                      'local_measure':r['local_measure'],
                      'global_measure_assuming_physical_page_split':base+r['local_measure'],
                      'count':r['count'],
                      'offsets_quarter_units':r['offsets_quarter_units'],
                  })
          result={
              'reader':'HOMR 0.7.0',
              'physical_expected_measures_per_page':physical_counts,
              'pages':pages,
              'global_rows':global_rows,
          }
          print('BUX_HOMR_JSON='+json.dumps(result,separators=(',',':')))
          for target in (4,5,46):
              rr=[r for r in global_rows if r['global_measure_assuming_physical_page_split']==target]
              print('TARGET m%d: %s' % (target, rr[0] if rr else 'MISSING'))
          Path('buxtehude-homr-diagnostics.json').write_text(json.dumps(result,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: buxtehude-homr-output
          path: |
            homr_pages/*.musicxml
            buxtehude-homr-diagnostics.json
